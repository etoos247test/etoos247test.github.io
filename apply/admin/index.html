<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f7faf8">
<title>QR 접수관리 | 이투스247학원</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:#f5f8f6;color:#20332a}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{width:min(1180px,calc(100% - 30px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#2b7e59;color:#fff;font-weight:950}.brand strong{display:block;font-size:14px}.brand small{display:block;color:#7a8b82;font-size:10px;margin-top:2px}.back{padding:9px 12px;border:1px solid #d5e0da;border-radius:10px;background:#fff;font-size:12px;font-weight:850}.hero{padding:30px 0 22px}.eyebrow{margin:0;color:#2f8f63;font-size:10px;font-weight:950;letter-spacing:.13em}.hero h1{margin:6px 0 0;font-size:clamp(34px,5vw,54px);letter-spacing:-.05em}.hero p{margin:10px 0 0;color:#708078;font-size:13px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:18px}.stat{padding:14px;border:1px solid #dce6e1;border-radius:15px;background:#fff}.stat small{display:block;color:#7e8e86;font-size:10px}.stat strong{display:block;margin-top:5px;font-size:23px}.tools{display:grid;grid-template-columns:1fr 180px 180px auto;gap:9px;margin:14px 0}.tools input,.tools select{width:100%;padding:11px 12px;border:1px solid #cedad3;border-radius:11px;background:#fff}.tools button{border:0;border-radius:11px;background:#21372d;color:#fff;padding:0 15px;font-weight:900}.list{display:grid;gap:10px;padding-bottom:60px}.item{display:grid;grid-template-columns:120px minmax(0,1fr) 170px 150px auto;gap:14px;align-items:center;padding:16px;border:1px solid #dce6e1;border-radius:17px;background:#fff}.receipt{font-size:11px;font-weight:950;color:#2f8f63}.name strong{display:block;font-size:17px}.name small,.meta{display:block;margin-top:4px;color:#7c8c84;font-size:11px;line-height:1.5}.contact strong{display:block;font-size:13px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#edf6f1;color:#2c7757;font-size:10px;font-weight:900}.pill.registered{background:#eaf1ff;color:#4168b0}.pill.closed{background:#f1f1f1;color:#777}.open{min-height:36px;border:1px solid #d5e0da;border-radius:9px;background:#fff;font-weight:850}.empty{padding:50px 20px;text-align:center;border:1px dashed #cad7d0;border-radius:17px;color:#7b8c83;background:#fff}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:rgba(16,30,23,.5);backdrop-filter:blur(4px)}.modal.show{display:grid}.box{position:relative;width:min(720px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:22px;background:#fff}.close{position:absolute;right:14px;top:11px;border:0;background:transparent;font-size:25px}.box h2{margin:0 0 6px}.box .sub{color:#718078;font-size:12px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.detail div{padding:11px;border-radius:11px;background:#f6f9f7}.detail small{display:block;color:#7c8d84;font-size:10px}.detail strong{display:block;margin-top:4px;font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:12px;font-weight:850}.formgrid .wide{grid-column:1/-1}.formgrid input,.formgrid select,.formgrid textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #cedad3;border-radius:10px}.formgrid textarea{min-height:120px;resize:vertical}.save{grid-column:1/-1;min-height:44px;border:0;border-radius:11px;background:#2b7e59;color:#fff;font-weight:950}.linkbox{margin-top:18px;padding-top:17px;border-top:1px solid #e3e9e5}.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px}.linkrow input{padding:11px;border:1px solid #cedad3;border-radius:10px}.linkrow button{border:0;border-radius:10px;background:#263c31;color:#fff;padding:0 14px;font-weight:900}.loginwarn{margin-top:40px;padding:32px;border:1px solid #e1e8e4;border-radius:20px;background:#fff;text-align:center}.loginwarn a{display:inline-flex;margin-top:12px;padding:11px 14px;border-radius:10px;background:#253a30;color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;z-index:150;transform:translateX(-50%);display:none;padding:10px 14px;border-radius:10px;background:#20352b;color:#fff;font-size:12px}.toast.show{display:block}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.item{grid-template-columns:100px 1fr 130px auto}.contact{display:none}}@media(max-width:600px){.shell{width:min(100% - 18px,1180px)}.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}.item{grid-template-columns:1fr auto}.item>.receipt{grid-column:1/-1}.item>.meta{display:none}.formgrid,.detail{grid-template-columns:1fr}.formgrid .wide,.save{grid-column:auto}.hero{padding-top:18px}}
</style>
</head>
<body>
<header class="top shell"><div class="brand"><span class="mark">247</span><span><strong>이투스247학원</strong><small>QR INTAKE MANAGER</small></span></div><a class="back" href="../../">← 기본 대문</a></header>
<main class="shell">
<section id="app" style="display:none">
  <div class="hero"><p class="eyebrow">TEACHER WORK</p><h1>QR 접수관리</h1><p id="who">접수 → 상담배정 → 상담기록 → 등록처리를 한 화면에서 관리합니다.</p><div id="stats" class="stats"></div></div>
  <div class="tools"><input id="search" placeholder="이름·학교·연락처·접수번호 검색"><select id="statusFilter"><option value="">상태 전체</option><option value="new">신규</option><option value="contacted">연락완료</option><option value="reserved">상담예약</option><option value="counseled">상담완료</option><option value="registered">등록</option><option value="closed">종결</option></select><select id="campusFilter"><option value="">관 전체</option><option value="undecided">미정</option><option value="suseong1">수성1관</option><option value="suseong2">수성2관</option></select><button id="csvBtn">CSV 저장</button></div>
  <div id="rows" class="list"></div>
</section>
<section id="loginWarn" class="loginwarn" style="display:none"><h2>교사용 로그인이 필요합니다.</h2><p>기본 대문에서 교사 또는 마스터 ID로 로그인한 뒤 접수관리를 열어주세요.</p><a href="../../">교사용 로그인으로 이동</a></section>
</main>
<div id="modal" class="modal"><div class="box"><button id="close" class="close">×</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const API='https://my247-intake-api.etoos247test.workers.dev',MAIN='https://my247-api.etoos247test.workers.dev',TK='my247Session';
const token=sessionStorage.getItem(TK)||'';let data=[],staff=[],me=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const campus=c=>c==='suseong1'?'수성1관':c==='suseong2'?'수성2관':'미정';
const statusName=s=>({new:'신규',contacted:'연락완료',reserved:'상담예약',counseled:'상담완료',registered:'등록',closed:'종결'}[s]||s);
const program=x=>x||'-';
function subjects(v){try{return JSON.parse(v||'[]').join(' · ')}catch{return''}}
function phone(v){const s=String(v||'').replace(/\D/g,'');return s.length===11?`${s.slice(0,3)}-${s.slice(3,7)}-${s.slice(7)}`:s}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}
async function api(base,path,opt={}){const h={...(opt.headers||{}),Authorization:`Bearer ${token}`};if(opt.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(base+path,{...opt,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`서버 오류 ${r.status}`);return d}
async function load(){if(!token){$('#loginWarn').style.display='block';return}try{const [a,s,m]=await Promise.all([api(API,'/api/applications'),api(API,'/api/staff'),api(MAIN,'/api/me')]);data=a.applications;staff=s.staff;me=m;$('#app').style.display='block';$('#who').textContent=`${m.user.name} · ${(m.campuses||[]).map(campus).join(' · ')||'전체'} · 접수 → 상담배정 → 상담기록 → 등록처리`;renderStats();render()}catch(e){sessionStorage.removeItem(TK);$('#loginWarn').style.display='block';toast(e.message)}}
function renderStats(){const keys=['new','contacted','reserved','counseled','registered','closed'];$('#stats').innerHTML=keys.map(k=>`<div class="stat"><small>${statusName(k)}</small><strong>${data.filter(x=>x.status===k).length}</strong></div>`).join('')}
function filtered(){const q=$('#search').value.trim().toLowerCase(),st=$('#statusFilter').value,ca=$('#campusFilter').value;return data.filter(x=>(!st||x.status===st)&&(!ca||x.campus===ca)&&(!q||[x.receipt_no,x.student_name,x.school,x.phone,x.guardian_phone,x.program].some(v=>String(v||'').toLowerCase().includes(q))))}
function render(){const rows=filtered();$('#rows').innerHTML=rows.length?rows.map(x=>`<article class="item"><div class="receipt">${esc(x.receipt_no)}</div><div class="name"><strong>${esc(x.student_name)}</strong><small>${esc(x.school||'학교 미입력')} · ${esc(x.grade||'구분 미입력')} · ${esc(program(x.program))}</small><small>${esc(subjects(x.subjects_json))}</small></div><div class="contact"><strong>${esc(phone(x.phone))}</strong><small>${esc(x.guardian_phone?`보호자 ${phone(x.guardian_phone)}`:'')}</small></div><div class="meta"><span class="pill ${x.status}">${statusName(x.status)}</span><span>${campus(x.campus)}${x.assigned_name?` · ${esc(x.assigned_name)}`:''}</span></div><button class="open" data-id="${x.id}">상세</button></article>`).join(''):'<div class="empty">조건에 맞는 접수 건이 없습니다.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}
function staffOptions(selected){return`<option value="">담당 미정</option>`+staff.map(s=>`<option value="${esc(s.loginId)}" ${s.loginId===selected?'selected':''}>${esc(s.name)} · ${esc(s.loginId)}</option>`).join('')}
function openDetail(id){const x=data.find(v=>v.id===id);if(!x)return;$('#modalBody').innerHTML=`<h2>${esc(x.student_name)} <span class="pill ${x.status}">${statusName(x.status)}</span></h2><div class="sub">${esc(x.receipt_no)} · ${esc((x.created_at||'').slice(0,16).replace('T',' '))} · 경로 ${esc(x.source||'-')}</div><div class="detail"><div><small>학교·학년</small><strong>${esc(x.school||'-')} · ${esc(x.grade||'-')}</strong></div><div><small>연락처</small><strong>${esc(phone(x.phone))}${x.guardian_phone?` / ${esc(phone(x.guardian_phone))}`:''}</strong></div><div><small>희망 과정</small><strong>${esc(x.program)} · ${esc(subjects(x.subjects_json)||'과목 미선택')}</strong></div><div><small>희망 상담일</small><strong>${esc(x.preferred_date||'-')}</strong></div></div>${x.inquiry?`<div class="detail" style="grid-template-columns:1fr"><div><small>문의 내용</small><strong style="white-space:pre-wrap;font-weight:650;line-height:1.6">${esc(x.inquiry)}</strong></div></div>`:''}<form id="editForm" class="formgrid"><label>상태<select name="status"><option value="new">신규</option><option value="contacted">연락완료</option><option value="reserved">상담예약</option><option value="counseled">상담완료</option><option value="registered">등록</option><option value="closed">종결</option></select></label><label>상담 관<select name="campus"><option value="undecided">미정</option><option value="suseong1">수성1관</option><option value="suseong2">수성2관</option></select></label><label>담당자<select name="assignedLoginId">${staffOptions(x.assigned_login||'')}</select></label><label>상담 예약일시<input name="appointmentAt" type="datetime-local" value="${esc((x.appointment_at||'').slice(0,16))}"></label><label class="wide">상담 기록<textarea name="counselNote" placeholder="상담 내용, 다음 연락, 등록 검토사항 등을 기록합니다.">${esc(x.counsel_note||'')}</textarea></label><button class="save" type="submit">상담정보 저장</button></form>${me?.user?.role==='master'?`<div class="linkbox"><strong>재원생 ID 연결</strong><p class="sub">등록 후 기존 학생 ID를 연결하면 접수자 → 재원생 흐름이 이어집니다.${x.student_login?` 현재 연결: ${esc(x.student_login)}`:''}</p><form id="linkForm" class="linkrow"><input name="studentLoginId" placeholder="예: M001 / S001" value="${esc(x.student_login||'')}"><button>재원생 연결</button></form></div>`:''}`;const f=$('#editForm');f.status.value=x.status;f.campus.value=x.campus;f.onsubmit=async e=>{e.preventDefault();const z=e.target;try{await api(API,`/api/applications/${id}`,{method:'PATCH',body:JSON.stringify({status:z.status.value,campus:z.campus.value,assignedLoginId:z.assignedLoginId.value,appointmentAt:z.appointmentAt.value,counselNote:z.counselNote.value})});toast('상담정보를 저장했습니다.');closeModal();await reload()}catch(err){toast(err.message)}};const l=$('#linkForm');if(l)l.onsubmit=async e=>{e.preventDefault();try{await api(API,`/api/applications/${id}/link-student`,{method:'POST',body:JSON.stringify({studentLoginId:e.target.studentLoginId.value})});toast('재원생 ID를 연결했습니다.');closeModal();await reload()}catch(err){toast(err.message)}};$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}$('#close').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
async function reload(){const a=await api(API,'/api/applications');data=a.applications;renderStats();render()}
['#search','#statusFilter','#campusFilter'].forEach(s=>$(s).addEventListener(s==='#search'?'input':'change',render));
$('#csvBtn').onclick=()=>{const rows=filtered(),cols=[['접수번호','receipt_no'],['접수일','created_at'],['학생','student_name'],['학교','school'],['학년','grade'],['연락처','phone'],['보호자연락처','guardian_phone'],['관','campus'],['과정','program'],['상태','status'],['담당자','assigned_name'],['상담예약','appointment_at'],['상담기록','counsel_note']];const csv='\ufeff'+[cols.map(x=>x[0]),...rows.map(r=>cols.map(([,k])=>String(r[k]??'').replaceAll('"','""')))].map(row=>row.map(v=>`"${v}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`QR접수_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
load();
</script>
</body>
</html>
