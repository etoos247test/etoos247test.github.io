<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>성적 입력 | 이투스247</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#eef3f9;color:#172033;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}main{width:min(1050px,100%);margin:auto}.head,.card{padding:20px;border:1px solid #d8e0eb;border-radius:16px;background:#fff}.head h1{margin:0;font-size:26px}.head p{margin:8px 0 0;color:#64748b;line-height:1.65}.status{margin:14px 0;padding:13px;border-radius:12px;background:#f8fafc;border:1px solid #cbd5e1;white-space:pre-wrap}.success{background:#f0fdf4;border-color:#86efac;color:#166534}.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.card{margin-top:14px}label{display:block;font-weight:850;color:#334155}input,select{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.base{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;gap:12px}.score-table{width:100%;margin-top:16px;border-collapse:collapse}.score-table th,.score-table td{padding:9px;border:1px solid #dbe3ed;text-align:center}.score-table th{background:#eff6ff}.score-table input{margin:0;text-align:center}.save{width:100%;margin-top:16px;min-height:46px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:900;cursor:pointer}.note{margin-top:12px;color:#64748b;font-size:12px;line-height:1.65}.hidden{display:none!important}@media(max-width:760px){body{padding:10px}.base{grid-template-columns:1fr 1fr}.score-table{display:block;overflow:auto}.score-table input{min-width:82px}}@media(max-width:480px){.base{grid-template-columns:1fr}}</style>
</head>
<body><main>
<section class="head"><h1>학생 성적 입력</h1><p>전년도 수능부터 3월 1차·2차, 11월 2차까지 시험별 성적을 저장합니다. 국어·수학·영어·통합사회·통합과학을 관리합니다.</p></section>
<div id="status" class="status">성적 입력 권한을 확인하는 중입니다.</div>
<form id="scoreForm" class="card hidden">
<div class="base">
<label>학년도<input id="schoolYear" type="number" min="2026" max="2100" value="2027" required></label>
<label>학생번호<input id="studentId" maxlength="4" placeholder="M001 또는 S001" required></label>
<label>기본 회차<select id="period" required><option value="baseline">전년도 수능</option></select></label>
<label>시험일<input id="examDate" type="date"></label>
</div>
<label style="margin-top:12px">실제 시험명<input id="examName" maxlength="100" placeholder="예: 이투스 전국 모의고사" required></label>
<table class="score-table"><thead><tr><th>영역</th><th>원점수</th><th>표준점수</th><th>백분위</th><th>등급</th></tr></thead><tbody id="scoreBody"></tbody></table>
<button id="saveButton" class="save" type="submit">성적 저장</button>
<div class="note">영어는 표준점수·백분위를 비워둘 수 있습니다. 같은 학년도·학생·회차를 다시 저장하면 기존 기록을 수정합니다.</div>
</form>
</main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { doc,getDoc,serverTimestamp,setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import { auth,authPersistenceReady,db } from "../question-access/firebase-client.js";
const subjects=[["KOR","국어"],["MATH","수학"],["ENG","영어"],["SOCIAL","통합사회"],["SCIENCE","통합과학"]];
const $=id=>document.getElementById(id),status=(t,c="")=>{$("status").className=`status ${c}`.trim();$("status").textContent=t};let user,profile;
for(let m=3;m<=11;m++)for(let r=1;r<=2;r++){const o=document.createElement("option");o.value=`${m}-${r}`;o.textContent=`${m}월 ${r}차`;$("period").appendChild(o)}
$("scoreBody").innerHTML=subjects.map(([code,label])=>`<tr data-code="${code}"><th>${label}</th>${["raw","standard","percentile","grade"].map(k=>`<td><input data-key="${k}" type="number" step="0.1" min="0"></td>`).join("")}</tr>`).join("");
function campusOf(id){return id.startsWith("M")?"suseong1":id.startsWith("S")?"suseong2":""}
function hasScorePermission(){return profile?.role==="master"||(profile?.role==="teacher"&&profile?.active===true&&profile?.canManageScores!==false)}
function canCampus(c){return hasScorePermission()&&(profile?.role==="master"||(Array.isArray(profile?.allowedCampuses)&&profile.allowedCampuses.includes(c)))}
function value(input){return input.value===""?null:Number(input.value)}
$("scoreForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("saveButton");btn.disabled=true;try{const studentId=$("studentId").value.trim().toUpperCase(),campus=campusOf(studentId);if(!/^[MS](00[1-9]|0[1-9][0-9]|1[0-9]{2})$/.test(studentId))throw new Error("학생번호는 M001~M199 또는 S001~S199 형식이어야 합니다.");if(!canCampus(campus))throw new Error("해당 관 학생 성적을 입력할 권한이 없습니다.");const codeSnap=await getDoc(doc(db,"studentCodes",studentId));if(!codeSnap.exists())throw new Error("승인된 학생번호가 아닙니다.");const scores={};document.querySelectorAll("#scoreBody tr").forEach(tr=>{const row={};tr.querySelectorAll("input").forEach(i=>row[i.dataset.key]=value(i));scores[tr.dataset.code]=row});const schoolYear=Number($("schoolYear").value),period=$("period").value,recordId=`${schoolYear}_${studentId}_${period.replace(/[^a-z0-9-]/gi,"_")}`;await setDoc(doc(db,"studentScores",recordId),{schoolYear,studentId,studentUid:codeSnap.data().uid,campus,periodLabel:$("period").selectedOptions[0].textContent,examName:$("examName").value.trim(),examDate:$("examDate").value,scores,updatedBy:user.uid,updatedAt:serverTimestamp(),createdBy:user.uid,createdAt:serverTimestamp()},{merge:true});status(`${studentId} · ${$("period").selectedOptions[0].textContent} 성적을 저장했습니다.`,"success")}catch(err){status(err.message||String(err),"error")}finally{btn.disabled=false}});
onAuthStateChanged(auth,async u=>{await authPersistenceReady;if(!u){status("교사용 화면에서 로그인한 뒤 다시 열어 주세요.","error");return}user=u;const snap=await getDoc(doc(db,"users",u.uid));profile=snap.exists()?snap.data():null;if(!hasScorePermission()){status("성적 입력 권한이 없습니다. 마스터가 ‘성적 입력·수정’ 권한을 부여해야 합니다.","error");return}$("scoreForm").classList.remove("hidden");status(`성적 입력 권한 허용 · ${u.displayName||profile.name||u.email}`,"success")});
</script></body></html>
