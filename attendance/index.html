<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>이투스247학원 수성점 공용 출석부</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fb;--line:#dbe2ea;--head:#eef3f8;--text:#172033;--muted:#667085;--green:#eaf8ee;--blue:#175cd3}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{padding:8px}.top{position:sticky;top:0;z-index:50;background:rgba(245,247,251,.97);padding:6px 0 10px}.titlebar{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}h1{margin:0;font-size:21px}.sub{margin-top:3px;font-size:12px;color:var(--muted)}.status{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:white}.toolbar{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}.toolbar label{font-size:12px;font-weight:800;color:#475467}.toolbar select,.toolbar input[type=date],button{height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;font:inherit}button{font-weight:800;cursor:pointer}button.primary{background:#172033;color:white;border-color:#172033}button:disabled{opacity:.45;cursor:not-allowed}.user{margin-left:auto;font-size:12px;color:#475467}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:7px 9px}.card small{display:block;color:var(--muted);font-size:11px}.card b{font-size:18px}.notice{display:none;margin-top:7px;padding:8px 10px;background:#fff8e8;border:1px solid #efd59b;border-radius:8px;font-size:12px;color:#7a4b00}.notice.show{display:block}.wrap{height:calc(100vh - 194px);min-height:430px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%}th{position:sticky;top:0;z-index:30;background:var(--head);height:43px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}td{height:45px;padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:white}tr:nth-child(even) td:not(.num):not(.name){background:#fbfcfe}.num{width:55px;min-width:55px;text-align:center;font-weight:900}.name{width:130px;min-width:130px}.reason{width:170px;min-width:170px}.period{width:72px;min-width:72px;text-align:center}.note{width:210px;min-width:210px}.who{width:150px;min-width:150px;font-size:11px;color:#667085;padding:4px 6px}.num,.name{position:sticky;z-index:15;background:#fff}.num{left:0}.name{left:55px;box-shadow:2px 0 0 #e2e8f0}thead .num,thead .name{z-index:40;background:var(--head)}.nm{padding:0 8px;font-weight:800;font-size:14px}.txt{width:100%;height:44px;border:0;background:transparent;padding:5px 8px;outline:none;font-size:14px}.txt:focus{background:#fff9d8;box-shadow:inset 0 0 0 2px #f2c94c}.tap{height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.tap input{position:absolute;opacity:0}.box{width:35px;height:35px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}.tap input:checked+.box{background:var(--green);border-color:#65b77b;color:#157334}.tap input:checked+.box:after{content:"✓"}.login{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}.login.hidden{display:none}.loginbox{width:min(100%,430px);background:#fff;padding:24px;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.loginbox h2{margin:0 0 8px}.loginbox p{font-size:14px;color:#667085;line-height:1.6}.loginbox button{width:100%;height:48px;background:var(--blue);color:#fff;border-color:var(--blue)}#loginError{margin-top:10px;font-size:12px;color:#b42318}.file{display:none}@media(max-width:760px){h1{font-size:17px}.summary{grid-template-columns:repeat(2,1fr)}.user{width:100%;text-align:right;margin-left:0}.wrap{height:calc(100vh - 260px)}}
</style>
</head>
<body>
<div class="login" id="login"><div class="loginbox"><h2>교사 인증</h2><p>승인된 이투스247 교사 또는 마스터 Google 계정으로 로그인해 주세요.</p><button id="loginBtn">Google 계정으로 로그인</button><div id="loginError"></div></div></div>
<div class="top"><div class="titlebar"><div><h1>이투스247학원 수성점 공용 출석부</h1><div class="sub">120명 · 1~7교시 · 여러 태블릿 실시간 동기화</div></div><div class="status" id="status">로그인 대기</div></div>
<div class="toolbar"><label>관 <select id="campus" disabled></select></label><label>날짜 <input id="date" type="date" disabled></label><input class="file" id="file" type="file" accept=".xlsx,.xls,.csv"><button id="import" disabled>엑셀 명단 불러오기</button><button id="export" disabled>출석부 엑셀 저장</button><button id="print" disabled>인쇄</button><span class="user" id="user">로그인하지 않음</span><button id="logout" disabled>로그아웃</button></div><div class="notice" id="notice"></div>
<div class="summary"><div class="card"><small>등록 학생</small><b id="students">0</b></div><div class="card"><small>체크 수</small><b id="checks">0</b></div><div class="card"><small>사유 입력</small><b id="reasons">0</b></div><div class="card"><small>비고 입력</small><b id="notes">0</b></div></div></div>
<div class="wrap"><table><thead><tr><th class="num">번호</th><th class="name">이름</th><th class="reason">사유</th><th class="period">1교시</th><th class="period">2교시</th><th class="period">3교시</th><th class="period">4교시</th><th class="period">5교시</th><th class="period">6교시</th><th class="period">7교시</th><th class="note">비고</th><th class="who">최종 수정</th></tr></thead><tbody id="body"></tbody></table></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,onSnapshot,setDoc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAg6PnWUVfvlc10R81wb2liVxyGMbqbw78",authDomain:"etoos247test-10ffa.firebaseapp.com",projectId:"etoos247test-10ffa",storageBucket:"etoos247test-10ffa.firebasestorage.app",messagingSenderId:"795523938504",appId:"1:795523938504:web:1f5815dc67dd0906310dfd",measurementId:"G-NS4NCBBG4S"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
const $=x=>document.getElementById(x),body=$("body"),campus=$("campus"),date=$("date"),notice=$("notice");let me=null,profile=null,currentCampus=null,roster=new Map(),records=new Map(),u1=null,u2=null,canRoster=false,timers=new Map();
const no=n=>String(n).padStart(3,"0"),campusName=c=>c==="suseong1"?"수성1관":c==="suseong2"?"수성2관":c;function today(){const d=new Date(),z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}date.value=today();
for(let n=1;n<=120;n++){const tr=document.createElement("tr"),id=no(n);tr.dataset.no=id;tr.innerHTML=`<td class="num">${n}</td><td class="name"><div class="nm" data-name></div></td><td class="reason"><input class="txt" data-f="reason" disabled></td>${[1,2,3,4,5,6,7].map(p=>`<td class="period"><label class="tap"><input type="checkbox" data-f="p${p}" disabled><span class="box"></span></label></td>`).join("")}<td class="note"><input class="txt" data-f="note" disabled></td><td class="who" data-who></td>`;body.appendChild(tr)}
function status(s){$("status").textContent=s}function say(s){notice.textContent=s;notice.classList.add("show")}function editable(v){body.querySelectorAll("input[data-f]").forEach(x=>x.disabled=!v)}function allowed(){if(!profile)return[];return profile.role==="master"?["suseong1","suseong2"]:(Array.isArray(profile.allowedCampuses)?profile.allowedCampuses:[]).filter(x=>["suseong1","suseong2"].includes(x))}
function summary(){$("students").textContent=[...roster.values()].filter(x=>x.name).length;let c=0,r=0,n=0;records.forEach(x=>{for(let p=1;p<=7;p++)if(x[`p${p}`])c++;if((x.reason||"").trim())r++;if((x.note||"").trim())n++});$("checks").textContent=c;$("reasons").textContent=r;$("notes").textContent=n}
function drawRoster(){for(let n=1;n<=120;n++){const id=no(n);body.querySelector(`tr[data-no="${id}"] [data-name]`).textContent=roster.get(id)?.name||""}summary()}function drawRecords(){for(let n=1;n<=120;n++){const id=no(n),tr=body.querySelector(`tr[data-no="${id}"]`),r=records.get(id)||{};for(const f of["reason","note"]){const x=tr.querySelector(`[data-f="${f}"]`);if(document.activeElement!==x)x.value=r[f]||""}for(let p=1;p<=7;p++)tr.querySelector(`[data-f="p${p}"]`).checked=!!r[`p${p}`];const when=r.updatedAt?.toDate?r.updatedAt.toDate().toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";tr.querySelector("[data-who]").textContent=[r.updatedByName||"",when].filter(Boolean).join(" · ")}summary()}
function stop(){u1?.();u2?.();u1=u2=null}function listen(){stop();roster.clear();records.clear();drawRoster();drawRecords();if(!currentCampus)return;status("동기화 연결 중");u1=onSnapshot(collection(db,"attendance",currentCampus,"students"),s=>{roster.clear();s.forEach(d=>roster.set(d.id,d.data()));drawRoster();status("실시간 동기화")},e=>{status("명단 권한 오류");say(e.message)});u2=onSnapshot(collection(db,"attendance",currentCampus,"days",date.value,"records"),s=>{records.clear();s.forEach(d=>records.set(d.id,d.data()));drawRecords();editable(true);status("실시간 동기화")},e=>{editable(false);status("출석 권한 오류");say("Firestore 출석부 규칙을 먼저 게시해야 합니다.")})}
async function save(id,f,v){if(!me||!currentCampus)return;const p={campus:currentCampus,date:date.value,studentNo:id,updatedAt:serverTimestamp(),updatedBy:me.uid,updatedByName:me.displayName||profile.name||me.email||"교사"};p[f]=v;try{status("저장 중");await setDoc(doc(db,"attendance",currentCampus,"days",date.value,"records",id),p,{merge:true});status("실시간 동기화")}catch(e){status("저장 실패");say(e.message);drawRecords()}}
body.addEventListener("change",e=>{const x=e.target;if(x.matches('input[type="checkbox"][data-f]'))save(x.closest("tr").dataset.no,x.dataset.f,x.checked)});body.addEventListener("input",e=>{const x=e.target;if(!x.matches('input[data-f]:not([type="checkbox"])'))return;const id=x.closest("tr").dataset.no,k=id+x.dataset.f;clearTimeout(timers.get(k));timers.set(k,setTimeout(()=>save(id,x.dataset.f,x.value.trim()),700))});body.addEventListener("blur",e=>{const x=e.target;if(!x.matches('input[data-f]:not([type="checkbox"])'))return;save(x.closest("tr").dataset.no,x.dataset.f,x.value.trim())},true);
$("loginBtn").onclick=async()=>{try{$("loginError").textContent="";await signInWithPopup(auth,provider)}catch(e){if(e.code==="auth/popup-blocked")await signInWithRedirect(auth,provider);else $("loginError").textContent=e.message}};try{await getRedirectResult(auth)}catch(e){$("loginError").textContent=e.message}$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{stop();if(!u){me=profile=null;$("login").classList.remove("hidden");$("logout").disabled=true;campus.disabled=date.disabled=$("import").disabled=$("export").disabled=$("print").disabled=true;status("로그인 대기");editable(false);return}try{const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw Error("교사 권한 문서가 없습니다.");profile=s.data();if(profile.active!==true||!["teacher","master"].includes(profile.role))throw Error("승인된 교사 계정이 아닙니다.");if(!allowed().length)throw Error("접근 가능한 소속관이 없습니다.");me=u;canRoster=profile.role==="master"||(profile.role==="teacher"&&profile.canManageStudentInfo===true);campus.innerHTML=allowed().map(c=>`<option value="${c}">${campusName(c)}</option>`).join("");currentCampus=campus.value;campus.disabled=date.disabled=$("export").disabled=$("print").disabled=$("logout").disabled=false;$("import").disabled=!canRoster;$("user").textContent=`${u.displayName||profile.name||"교사"} · ${profile.role}`;$("login").classList.add("hidden");say(canRoster?"엑셀의 번호와 이름 열을 기준으로 명단을 갱신할 수 있습니다.":"출결 수정 권한으로 접속했습니다.");listen()}catch(e){$("loginError").textContent=e.message;await signOut(auth)}});
campus.onchange=()=>{currentCampus=campus.value;listen()};date.onchange=listen;$("print").onclick=()=>window.print();$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files?.[0];e.target.value="";if(!f||!canRoster)return;try{const b=await f.arrayBuffer(),wb=XLSX.read(b,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:""});if(!rows.length)throw Error("엑셀 데이터가 없습니다.");const hs=Object.keys(rows[0]),norm=s=>String(s).trim().toLowerCase().replace(/\s/g,"");let nk=hs.find(h=>["번호","순번","no","studentno","학생번호"].includes(norm(h))),mk=hs.find(h=>["이름","성명","학생명","name"].includes(norm(h)));if(!nk||!mk){nk=nk||hs[0];mk=mk||hs[1]}const valid=[];for(const r of rows){const n=parseInt(String(r[nk]).replace(/[^0-9]/g,""),10),name=String(r[mk]??"").trim();if(n>=1&&n<=120&&name)valid.push({n,name})}if(!valid.length)throw Error("1~120 번호와 이름을 찾지 못했습니다.");const batch=writeBatch(db);for(const x of valid){const id=no(x.n);batch.set(doc(db,"attendance",currentCampus,"students",id),{campus:currentCampus,studentNo:id,number:x.n,name:x.name,updatedAt:serverTimestamp(),updatedBy:me.uid,updatedByName:me.displayName||profile.name||me.email||"관리자"})}await batch.commit();say(`${campusName(currentCampus)} 명단 ${valid.length}명을 반영했습니다.`)}catch(err){say("명단 불러오기 실패: "+err.message)}};
$("export").onclick=()=>{const rows=[];for(let n=1;n<=120;n++){const id=no(n),s=roster.get(id)||{},r=records.get(id)||{};rows.push({번호:n,이름:s.name||"",사유:r.reason||"","1교시":r.p1?"✓":"","2교시":r.p2?"✓":"","3교시":r.p3?"✓":"","4교시":r.p4?"✓":"","5교시":r.p5?"✓":"","6교시":r.p6?"✓":"","7교시":r.p7?"✓":"",비고:r.note||"",최종수정자:r.updatedByName||""})}const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"출석부");XLSX.writeFile(wb,`출석부_${campusName(currentCampus)}_${date.value}.xlsx`)};
</script>
</body></html>
