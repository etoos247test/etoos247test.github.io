name: Apply student identity sync patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-student-identity-sync.mjs"
      - ".github/workflows/apply-student-identity-sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: node scripts/apply-student-identity-sync.mjs
      - name: Commit patched teacher module
        run: |
          if git diff --quiet -- question-access/teacher.js; then
            echo "No teacher.js changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-access/teacher.js
          git commit -m "Synchronize student identity edits with Firebase Auth"
          git push
