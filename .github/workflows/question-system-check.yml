name: Question system checks

on:
  push:
    branches: [main]
    paths:
      - "question-access/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firebase-rules/**"
      - ".github/workflows/question-system-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript modules
        run: |
          set -e
          for file in question-access/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Check Cloud Functions JavaScript
        run: node --check functions/index.js
      - name: Check JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool firestore.indexes.json >/dev/null
          python -m json.tool functions/package.json >/dev/null
          python -m json.tool .firebaserc >/dev/null
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Parse Firestore rules in emulator
        run: firebase emulators:exec --only firestore --project demo-etoos247 "echo Firestore rules OK"
