name: Question system checks

on:
  push:
    branches: [main]
    paths:
      - "question-access/**"
      - "teacher-login/**"
      - "academy-board/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firebase-rules/**"
      - "storage.rules"
      - ".github/workflows/question-system-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Check browser JavaScript modules
        run: |
          set -e
          for file in question-access/*.js teacher-login/*.js academy-board/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Check Cloud Functions JavaScript
        run: node --check functions/index.js
      - name: Check JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool firestore.indexes.json >/dev/null
          python -m json.tool functions/package.json >/dev/null
          python -m json.tool .firebaserc >/dev/null
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Parse Firestore and Storage rules in emulators
        shell: bash
        run: |
          set +e
          output=$(firebase emulators:exec --only firestore,storage --project demo-etoos247 "echo Firebase rules OK" 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Firebase rules validation::$message"
            exit "$status"
          fi
