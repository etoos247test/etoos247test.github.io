name: Convert teacher tools for Google students

on:
  push:
    branches: [main]
    paths:
      - "scripts/convert-teacher-google-students.mjs"
      - ".github/workflows/convert-teacher-google-students.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Google student cleanup
        run: node scripts/convert-teacher-google-students.mjs
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-access/master.js question-access/teacher.js
          git commit -m "Remove student password management from teacher tools"
          git push
