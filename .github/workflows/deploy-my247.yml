name: Deploy MY247

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/my247-worker/**'
      - '.github/workflows/deploy-my247.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN is missing' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID is missing' && exit 1)
          test -n "${{ secrets.MASTER_BOOTSTRAP_KEY }}" || (echo 'MASTER_BOOTSTRAP_KEY is missing' && exit 1)
      - name: Apply D1 schema
        run: npx --yes wrangler@latest d1 execute etoos247-qa --remote --file=cloudflare/my247-worker/schema.sql --config=cloudflare/my247-worker/wrangler.jsonc
      - name: Set initial master bootstrap secret
        run: printf '%s' '${{ secrets.MASTER_BOOTSTRAP_KEY }}' | npx --yes wrangler@latest secret put MASTER_BOOTSTRAP_KEY --config=cloudflare/my247-worker/wrangler.jsonc
      - name: Deploy MY247 Worker
        run: npx --yes wrangler@latest deploy --config=cloudflare/my247-worker/wrangler.jsonc
      - name: Verify deployed API
        run: |
          set -euo pipefail
          BASE='https://my247-api.etoos247test.workers.dev'

          echo 'GET /health'
          curl --retry 8 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$BASE/health" | tee /tmp/health.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(d.ok!==true) throw new Error('health check failed')"

          echo 'GET /api/bootstrap/status'
          curl --retry 8 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$BASE/api/bootstrap/status" | tee /tmp/bootstrap.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/bootstrap.json','utf8')); if(typeof d.schemaReady!=='boolean'||typeof d.needsMaster!=='boolean') throw new Error('bootstrap status response invalid')"

          echo 'GET /api/rbac/catalog without login (route/auth check)'
          code=$(curl --retry 8 --retry-all-errors --retry-delay 2 --silent --show-error -o /tmp/catalog.json -w '%{http_code}' "$BASE/api/rbac/catalog")
          cat /tmp/catalog.json
          test "$code" = '401'
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/catalog.json','utf8')); if(d.message!=='로그인이 필요합니다.') throw new Error('RBAC route/auth response invalid')"
