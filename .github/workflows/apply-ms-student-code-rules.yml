name: Apply M and S student code patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-ms-student-code-rules.mjs"
      - ".github/workflows/apply-ms-student-code-rules.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: node scripts/apply-ms-student-code-rules.mjs
      - name: Commit patched teacher module
        run: |
          if git diff --quiet -- question-access/teacher.js; then
            echo "No teacher.js changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-access/teacher.js
          git commit -m "Apply M and S student code rules to teacher management"
          git push
