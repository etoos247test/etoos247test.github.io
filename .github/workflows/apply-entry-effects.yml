name: Apply entry and improvement animations

on:
  push:
    paths:
      - '.github/workflows/apply-entry-effects.yml'

permissions:
  contents: write

jobs:
  apply-effects:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create animation script and link it
        shell: bash
        run: |
          mkdir -p assets/js
          cat > assets/js/entry-effects.js <<'EOF'
          (() => {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const style = document.createElement('style');
            style.id = 'etoos-entry-effects-style';
            style.textContent = `
              body.etoos-intro-lock{overflow:hidden}
              .etoos-entry-sequence{position:fixed;inset:0;z-index:2147483000;pointer-events:none;overflow:hidden;background:transparent;isolation:isolate}
              .etoos-entry-panel{position:absolute;top:0;bottom:0;width:50.2%;background:
                linear-gradient(115deg,rgba(13,28,54,.97),rgba(5,10,22,.995)),
                repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px);
                box-shadow:0 0 60px rgba(40,100,255,.24);will-change:transform}
              .etoos-entry-panel.left{left:0;transform:translateX(-101%);animation:etoosPanelLeft 1.48s cubic-bezier(.72,0,.14,1) forwards}
              .etoos-entry-panel.right{right:0;transform:translateX(101%);animation:etoosPanelRight 1.48s cubic-bezier(.72,0,.14,1) forwards}
              .etoos-entry-seam{position:absolute;left:50%;top:0;width:2px;height:100%;transform:translateX(-50%) scaleY(0);background:linear-gradient(180deg,transparent,#7de7ff 30%,#fff 50%,#7de7ff 70%,transparent);filter:drop-shadow(0 0 18px #39d8ff);animation:etoosSeam 1.2s .38s ease-out forwards}
              .etoos-entry-core{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:#fff;box-shadow:0 0 30px 12px #8eeaff,0 0 90px 42px rgba(40,100,255,.8),0 0 180px 90px rgba(255,91,53,.35);animation:etoosCore 1.05s .42s ease-out forwards}
              .etoos-entry-ring{position:absolute;left:50%;top:50%;width:44px;height:44px;border:2px solid rgba(151,236,255,.9);border-radius:50%;transform:translate(-50%,-50%) scale(.15);opacity:0;box-shadow:0 0 28px rgba(57,216,255,.48);animation:etoosRing .9s .58s ease-out forwards}
              .etoos-entry-ring.r2{animation-delay:.67s;border-color:rgba(255,255,255,.6)}
              .etoos-entry-copy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.86);width:min(88vw,720px);text-align:center;color:#fff;opacity:0;filter:blur(9px);animation:etoosCopy .75s .63s ease-out forwards}
              .etoos-entry-copy small{display:block;margin-bottom:10px;color:#83e6ff;font:900 11px/1.3 Inter,Pretendard,sans-serif;letter-spacing:.26em}
              .etoos-entry-copy strong{display:block;font:900 clamp(30px,6vw,68px)/1.05 Inter,Pretendard,sans-serif;letter-spacing:-.07em;text-shadow:0 0 28px rgba(57,216,255,.34)}
              .etoos-entry-particle{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);opacity:0;transform:translate(-50%,-50%);animation:etoosParticle .82s var(--d) cubic-bezier(.1,.8,.2,1) forwards}
              @keyframes etoosPanelLeft{0%{transform:translateX(-101%)}34%,50%{transform:translateX(0)}100%{transform:translateX(-104%)}}
              @keyframes etoosPanelRight{0%{transform:translateX(101%)}34%,50%{transform:translateX(0)}100%{transform:translateX(104%)}}
              @keyframes etoosSeam{0%{transform:translateX(-50%) scaleY(0);opacity:0}32%{transform:translateX(-50%) scaleY(1);opacity:1}100%{transform:translateX(-50%) scaleY(1);opacity:0}}
              @keyframes etoosCore{0%{transform:translate(-50%,-50%) scale(0);opacity:0}28%{transform:translate(-50%,-50%) scale(1);opacity:1}56%{transform:translate(-50%,-50%) scale(8);opacity:.9}100%{transform:translate(-50%,-50%) scale(22);opacity:0}}
              @keyframes etoosRing{0%{transform:translate(-50%,-50%) scale(.15);opacity:.9}100%{transform:translate(-50%,-50%) scale(14);opacity:0}}
              @keyframes etoosCopy{0%{opacity:0;filter:blur(9px);transform:translate(-50%,-50%) scale(.86)}45%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}100%{opacity:0;filter:blur(3px);transform:translate(-50%,-54%) scale(1.035)}}
              @keyframes etoosParticle{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(.05)}}
              .etoos-entry-sequence.finish{animation:etoosOverlayOut .25s ease forwards}
              @keyframes etoosOverlayOut{to{opacity:0;visibility:hidden}}

              #improvement{position:relative;isolation:isolate}
              .improvement-portal{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden;border-radius:inherit;background:linear-gradient(180deg,rgba(244,247,251,.96),rgba(244,247,251,.6) 45%,transparent 100%);animation:improvementPortalFade 1.35s ease forwards}
              .improvement-portal:before{content:'';position:absolute;inset:-20% 0 auto;height:34%;background:linear-gradient(180deg,transparent,rgba(57,216,255,.13),rgba(40,100,255,.3),rgba(255,255,255,.9),rgba(57,216,255,.13),transparent);filter:blur(1px);animation:improvementScan 1.15s cubic-bezier(.2,.8,.2,1) forwards}
              .improvement-portal:after{content:'';position:absolute;left:50%;top:22%;width:min(62vw,560px);aspect-ratio:1;border:1px solid rgba(40,100,255,.36);border-radius:50%;transform:translate(-50%,-50%) scale(.2);box-shadow:0 0 0 30px rgba(57,216,255,.045),0 0 0 70px rgba(40,100,255,.035);animation:improvementRadar 1.2s ease-out forwards}
              .improvement-portal-label{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);color:#102a40;font:900 clamp(17px,2.6vw,32px)/1 Inter,Pretendard,sans-serif;letter-spacing:.18em;white-space:nowrap;opacity:0;animation:improvementLabel 1s .08s ease-out forwards}
              .improvement-portal-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(40,100,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(40,100,255,.055) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 78%);opacity:0;animation:improvementGrid .95s ease-out forwards}
              @keyframes improvementScan{from{transform:translateY(-120%)}to{transform:translateY(410%)}}
              @keyframes improvementRadar{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-25deg)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.65) rotate(90deg)}}
              @keyframes improvementLabel{0%{opacity:0;filter:blur(7px);letter-spacing:.32em}35%{opacity:1;filter:blur(0)}100%{opacity:0;letter-spacing:.12em;transform:translate(-50%,-72%)}}
              @keyframes improvementGrid{0%{opacity:0;transform:scale(1.08)}45%{opacity:1}100%{opacity:0;transform:scale(1)}}
              @keyframes improvementPortalFade{0%,72%{opacity:1}100%{opacity:0;visibility:hidden}}
              #improvement.improvement-energized{box-shadow:inset 0 0 0 1px rgba(57,216,255,.16),inset 0 80px 160px rgba(40,100,255,.055)}
              @media(max-width:600px){
                .etoos-entry-particle:nth-of-type(n+11){display:none}
                .etoos-entry-copy small{font-size:9px}.etoos-entry-copy strong{font-size:clamp(28px,10vw,44px)}
                .improvement-portal:after{width:92vw}.improvement-portal-label{font-size:18px;letter-spacing:.11em}
              }
              @media(prefers-reduced-motion:reduce){.etoos-entry-sequence,.improvement-portal{display:none!important}}
              @media print{.etoos-entry-sequence,.improvement-portal{display:none!important}}
            `;
            document.head.append(style);

            const playEntry = () => {
              if (reduceMotion || document.querySelector('.etoos-entry-sequence')) return;
              const overlay = document.createElement('div');
              overlay.className = 'etoos-entry-sequence';
              overlay.setAttribute('aria-hidden', 'true');
              overlay.innerHTML = `
                <div class="etoos-entry-panel left"></div>
                <div class="etoos-entry-panel right"></div>
                <div class="etoos-entry-seam"></div>
                <div class="etoos-entry-core"></div>
                <div class="etoos-entry-ring"></div>
                <div class="etoos-entry-ring r2"></div>
                <div class="etoos-entry-copy"><small>ETOOS 247 · DAEGU SUSEONG 1</small><strong>학습의 흐름을 다시 설계하다</strong></div>
              `;
              const vectors = [
                [-240,-170,'-80deg'],[-170,-250,'35deg'],[-55,-280,'105deg'],[90,-250,'145deg'],[220,-150,'210deg'],[275,-20,'260deg'],
                [240,150,'310deg'],[120,250,'380deg'],[-30,285,'430deg'],[-180,235,'500deg'],[-270,105,'560deg'],[-290,-55,'620deg'],
                [-150,-105,'690deg'],[150,-95,'740deg'],[165,90,'800deg'],[-130,120,'860deg']
              ];
              vectors.forEach((v, i) => {
                const p = document.createElement('i');
                p.className = 'etoos-entry-particle';
                p.style.setProperty('--x', `${v[0]}px`);
                p.style.setProperty('--y', `${v[1]}px`);
                p.style.setProperty('--r', v[2]);
                p.style.setProperty('--d', `${.54 + (i % 4) * .035}s`);
                p.style.setProperty('--s', `${3 + (i % 3) * 2}px`);
                p.style.setProperty('--c', i % 4 === 0 ? '#ff875e' : i % 3 === 0 ? '#ffffff' : '#58ddff');
                overlay.append(p);
              });
              document.body.classList.add('etoos-intro-lock');
              document.body.append(overlay);
              window.setTimeout(() => overlay.classList.add('finish'), 1580);
              window.setTimeout(() => {
                overlay.remove();
                document.body.classList.remove('etoos-intro-lock');
              }, 1860);
            };

            let improvementAnimating = false;
            let improvementCooldown = 0;
            const playImprovement = () => {
              const section = document.getElementById('improvement');
              if (!section || reduceMotion || improvementAnimating || Date.now() < improvementCooldown) return;
              improvementAnimating = true;
              improvementCooldown = Date.now() + 1800;
              section.querySelector('.improvement-portal')?.remove();
              const portal = document.createElement('div');
              portal.className = 'improvement-portal';
              portal.setAttribute('aria-hidden', 'true');
              portal.innerHTML = '<div class="improvement-portal-lines"></div><div class="improvement-portal-label">SYSTEM REBUILD</div>';
              section.prepend(portal);
              section.classList.add('improvement-energized');

              const targets = [
                ...section.querySelectorAll('.section-heading > *, .improvement-summary article, .improvement-core, .improvement-tabs, .improvement-pane.active > *, .improvement-actions')
              ];
              targets.forEach((el, index) => {
                el.animate([
                  {opacity:0,transform:'perspective(900px) translateY(48px) rotateX(11deg) scale(.95)',filter:'blur(7px)',clipPath:'inset(0 48% 0 48% round 16px)'},
                  {opacity:1,transform:'perspective(900px) translateY(0) rotateX(0) scale(1)',filter:'blur(0)',clipPath:'inset(0 0 0 0 round 0)'}
                ],{duration:680,delay:220 + index * 62,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
              });
              window.setTimeout(() => {
                portal.remove();
                section.classList.remove('improvement-energized');
                improvementAnimating = false;
              }, 1500 + targets.length * 24);
            };

            const improvement = document.getElementById('improvement');
            if (improvement) {
              const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                  if (entry.isIntersecting && entry.intersectionRatio >= .22) playImprovement();
                });
              }, {threshold:[0,.22,.45]});
              observer.observe(improvement);

              document.querySelectorAll('a[href="#improvement"]').forEach(link => {
                link.addEventListener('click', () => window.setTimeout(playImprovement, 420));
              });
              window.addEventListener('hashchange', () => {
                if (location.hash === '#improvement') window.setTimeout(playImprovement, 300);
              });
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', () => {
                playEntry();
                if (location.hash === '#improvement') window.setTimeout(playImprovement, 760);
              }, {once:true});
            } else {
              playEntry();
              if (location.hash === '#improvement') window.setTimeout(playImprovement, 760);
            }
          })();
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="./assets/js/entry-effects.js" defer></script>'
          if marker not in text:
              anchor = '<script src="./assets/js/main.js" defer></script>'
              if anchor not in text:
                  raise SystemExit('main.js script tag not found')
              text = text.replace(anchor, marker + '\n  ' + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated animation assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/entry-effects.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply animated page entry and improvement reveal"
            git push
          fi
