<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>상담 입력 | 이투스247</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#eef3f9;color:#172033;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}main{width:min(900px,100%);margin:auto}.head,.card{padding:20px;border:1px solid #d8e0eb;border-radius:16px;background:#fff}.head h1{margin:0;font-size:26px}.head p{margin:8px 0 0;color:#64748b;line-height:1.65}.status{margin:14px 0;padding:13px;border-radius:12px;background:#f8fafc;border:1px solid #cbd5e1;white-space:pre-wrap}.success{background:#f0fdf4;border-color:#86efac;color:#166534}.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.card{margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:850;color:#334155}input,select,textarea{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:110px;resize:vertical;line-height:1.65}.save{width:100%;margin-top:16px;min-height:46px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:900;cursor:pointer}.note{margin-top:12px;color:#64748b;font-size:12px;line-height:1.65}.hidden{display:none!important}@media(max-width:650px){body{padding:10px}.grid{grid-template-columns:1fr}}</style></head>
<body><main><section class="head"><h1>학생 상담 입력</h1><p>목록·검색·월별 정리는 입력일이 아니라 실제 상담일을 기준으로 합니다. 입력일과 입력자는 저장 시 자동 기록됩니다.</p></section>
<div id="status" class="status">교사 권한을 확인하는 중입니다.</div>
<form id="form" class="card hidden">
<div class="grid"><label>학년도<input id="schoolYear" type="number" min="2026" max="2100" value="2027" required></label><label>학생번호<input id="studentId" maxlength="4" placeholder="M001 또는 S001" required></label><label>상담일<input id="counselingDate" type="date" required></label><label>상담 목적(과목)<select id="purpose" required><option>학습전반</option><option>국어</option><option>수학</option><option>영어</option><option>통합사회</option><option>통합과학</option><option>성적분석</option><option>진학·지원전략</option><option>생활관리</option><option>출결관리</option><option>학부모상담</option><option>기타</option></select></label><label>상담자<input id="counselor" required></label><label>피상담자<select id="counselee"><option value="student">학생</option><option value="parent">학부모</option><option value="student_parent">학생+학부모</option><option value="guardian">보호자</option><option value="other">기타</option></select></label></div>
<label style="margin-top:12px">피상담자 세부사항<input id="counseleeDetail" placeholder="필요할 때만 입력: 어머니, 보호자 등"></label>
<label style="margin-top:12px">상담 내용<textarea id="content" required></textarea></label>
<label style="margin-top:12px">결정·안내사항<textarea id="decision"></textarea></label>
<label style="margin-top:12px">후속 확인사항<textarea id="followUp"></textarea></label>
<div class="grid" style="margin-top:12px"><label>다음 확인일<input id="nextCheckDate" type="date"></label><label>학생 공개범위<select id="visibility"><option value="summary">요약 공개</option><option value="full">전체 공개</option><option value="internal">학원 내부 전용</option></select></label></div>
<label style="margin-top:12px">학생 공개용 요약<textarea id="publicSummary" placeholder="요약 공개를 선택한 경우 학생에게 보여 줄 내용"></textarea></label>
<label style="margin-top:12px">학원 내부 메모<textarea id="internalNote" placeholder="학생에게 공개되지 않는 내부 메모"></textarea></label>
<button id="save" class="save" type="submit">상담기록 저장</button><div class="note">상담일은 수정할 수 있으며, 입력일·수정일은 서버에서 자동 관리합니다.</div>
</form></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import { addDoc,collection,doc,getDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";import { auth,authPersistenceReady,db } from "../question-access/firebase-client.js";
const $=id=>document.getElementById(id),status=(t,c="")=>{$("status").className=`status ${c}`.trim();$("status").textContent=t};let user,profile;$("counselingDate").value=new Date().toISOString().slice(0,10);function campusOf(id){return id.startsWith("M")?"suseong1":id.startsWith("S")?"suseong2":""}function canCampus(c){return profile?.role==="master"||(profile?.role==="teacher"&&profile?.active===true&&Array.isArray(profile.allowedCampuses)&&profile.allowedCampuses.includes(c)&&profile.canManageStudentInfo===true)}
$("form").addEventListener("submit",async e=>{e.preventDefault();const btn=$("save");btn.disabled=true;try{const studentId=$("studentId").value.trim().toUpperCase(),campus=campusOf(studentId);if(!/^[MS](00[1-9]|0[1-9][0-9]|1[0-9]{2})$/.test(studentId))throw new Error("학생번호는 M001~M199 또는 S001~S199 형식이어야 합니다.");if(!canCampus(campus))throw new Error("해당 관 학생 상담을 입력할 권한이 없습니다.");const codeSnap=await getDoc(doc(db,"studentCodes",studentId));if(!codeSnap.exists())throw new Error("승인된 학생번호가 아닙니다.");await addDoc(collection(db,"counselingRecords"),{schoolYear:Number($("schoolYear").value),studentId,studentUid:codeSnap.data().uid,campus,counselingDate:$("counselingDate").value,purpose:$("purpose").value,counselorUid:user.uid,counselorName:$("counselor").value.trim(),counseleeType:$("counselee").value,counseleeDetail:$("counseleeDetail").value.trim(),content:$("content").value.trim(),decision:$("decision").value.trim(),followUp:$("followUp").value.trim(),nextCheckDate:$("nextCheckDate").value,visibility:$("visibility").value,publicSummary:$("publicSummary").value.trim(),internalNote:$("internalNote").value.trim(),createdBy:user.uid,createdAt:serverTimestamp(),updatedBy:user.uid,updatedAt:serverTimestamp(),status:"active"});status(`${studentId} · ${$("counselingDate").value} 상담기록을 저장했습니다.`,"success");$("content").value="";$("decision").value="";$("followUp").value="";$("publicSummary").value="";$("internalNote").value=""}catch(err){status(err.message||String(err),"error")}finally{btn.disabled=false}});
onAuthStateChanged(auth,async u=>{await authPersistenceReady;if(!u){status("교사용 화면에서 로그인한 뒤 다시 열어 주세요.","error");return}user=u;const snap=await getDoc(doc(db,"users",u.uid));profile=snap.exists()?snap.data():null;const allowed=profile?.active===true&&(profile.role==="master"||(profile.role==="teacher"&&profile.canManageStudentInfo===true));if(!allowed){status("상담 입력 권한이 없습니다. 마스터가 학생정보 관리 권한을 부여해야 합니다.","error");return}$("counselor").value=u.displayName||profile.name||"";$("form").classList.remove("hidden");status(`상담 입력 가능 · ${u.displayName||profile.name||u.email}`,"success")});
</script></body></html>
