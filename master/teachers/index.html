<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>교사 권한 승인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 14px;background:#eef2f7;color:#172033;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}main{width:min(100%,980px);margin:28px auto;padding:28px;background:#fff;border:1px solid #d8e0eb;border-radius:18px;box-shadow:0 16px 42px rgba(15,23,42,.08)}h1{margin:0 0 8px;font-size:29px}.intro{margin:0 0 20px;color:#64748b;line-height:1.7}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{min-height:46px;border:0;border-radius:9px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#loginButton,#refreshButton{background:#2563eb;color:#fff}#logoutButton{background:#475569;color:#fff}.status{padding:15px;border:1px solid #d6deea;border-radius:11px;background:#f8fafc;line-height:1.7;white-space:pre-wrap}.success{border-color:#16a34a;background:#f0fdf4}.warning{border-color:#d97706;background:#fff7ed}.error{border-color:#dc2626;background:#fef2f2}.list{display:grid;gap:14px;margin-top:18px}.item{padding:18px;border:1px solid #d8e0eb;border-radius:13px;background:#fff}.item h2{margin:0 0 8px;font-size:19px}.meta{color:#475569;line-height:1.75;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.approve{background:#0f766e;color:#fff}.reject{background:#b91c1c;color:#fff}.badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#fff7ed;color:#9a3412;font-size:12px;font-weight:700}@media(max-width:640px){main{padding:20px}.toolbar button,.actions button{width:100%}}
  </style>
</head>
<body>
<main>
  <h1>교사 권한 승인</h1>
  <p class="intro">마스터 관리자만 접속할 수 있습니다. Google 로그인 후 교사 등록 요청을 검토하고 승인합니다.</p>
  <div class="toolbar">
    <button id="loginButton" type="button">마스터 Google 로그인</button>
    <button id="refreshButton" type="button" hidden>승인 대기 새로고침</button>
    <button id="logoutButton" type="button" hidden>로그아웃</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">로그인하지 않았습니다.</div>
  <section id="requestList" class="list" aria-label="교사 등록 요청 목록"></section>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig={
    apiKey:"AIzaSyAg6PnWUVfvlc10R81wb2liVxyGMbqbw78",
    authDomain:"etoos247test-10ffa.firebaseapp.com",
    projectId:"etoos247test-10ffa",
    storageBucket:"etoos247test-10ffa.firebasestorage.app",
    messagingSenderId:"795523938504",
    appId:"1:795523938504:web:1f5815dc67dd0906310dfd",
    measurementId:"G-NS4NCBBG4S"
  };

  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  const db=getFirestore(app);
  auth.languageCode="ko";
  const provider=new GoogleAuthProvider();
  provider.setCustomParameters({prompt:"select_account"});

  const loginButton=document.getElementById("loginButton");
  const refreshButton=document.getElementById("refreshButton");
  const logoutButton=document.getElementById("logoutButton");
  const statusBox=document.getElementById("status");
  const requestList=document.getElementById("requestList");
  let masterUser=null;

  function showStatus(message,type=""){
    statusBox.className=`status ${type}`.trim();
    statusBox.textContent=message;
  }

  function escapeHtml(value){
    return String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch]));
  }

  async function verifyMaster(user){
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists())return false;
    const data=snap.data();
    return data.role==="master"&&data.active===true;
  }

  async function loadRequests(){
    if(!masterUser)return;
    refreshButton.disabled=true;
    requestList.innerHTML="";
    showStatus("교사 등록 요청을 불러오는 중입니다.");
    try{
      const q=query(collection(db,"teacherRequests"),where("status","==","pending"));
      const snap=await getDocs(q);
      if(snap.empty){
        showStatus("마스터 권한 확인 완료\n현재 승인 대기 중인 교사 요청이 없습니다.","success");
        return;
      }

      showStatus(`마스터 권한 확인 완료\n승인 대기 요청: ${snap.size}건`,"success");
      snap.forEach(requestDoc=>{
        const data=requestDoc.data();
        const uid=requestDoc.id;
        const article=document.createElement("article");
        article.className="item";
        article.innerHTML=`
          <h2>${escapeHtml(data.name||"이름 없음")} <span class="badge">승인 대기</span></h2>
          <div class="meta">
            이메일: ${escapeHtml(data.email||"")}<br>
            Firebase UID: ${escapeHtml(uid)}
          </div>
          <div class="actions">
            <button class="approve" type="button">교사 승인</button>
            <button class="reject" type="button">요청 반려</button>
          </div>`;

        const approveButton=article.querySelector(".approve");
        const rejectButton=article.querySelector(".reject");

        approveButton.addEventListener("click",()=>approveTeacher(uid,data,article,approveButton,rejectButton));
        rejectButton.addEventListener("click",()=>rejectRequest(uid,article,approveButton,rejectButton));
        requestList.appendChild(article);
      });
    }catch(error){
      console.error(error);
      showStatus(`요청 조회 실패\n${error.code??""}\n${error.message??String(error)}`,"error");
    }finally{refreshButton.disabled=false}
  }

  async function approveTeacher(uid,data,article,...buttons){
    buttons.forEach(button=>button.disabled=true);
    showStatus(`${data.name||data.email||uid} 교사 권한을 승인하는 중입니다.`);
    try{
      const batch=writeBatch(db);
      batch.set(doc(db,"users",uid),{
        role:"teacher",
        active:true,
        name:data.name||"",
        email:data.email||"",
        createdAt:serverTimestamp(),
        approvedAt:serverTimestamp(),
        approvedBy:masterUser.uid
      },{merge:true});
      batch.update(doc(db,"teacherRequests",uid),{
        status:"approved",
        approvedAt:serverTimestamp(),
        approvedBy:masterUser.uid,
        updatedAt:serverTimestamp()
      });
      await batch.commit();
      article.remove();
      showStatus(`${data.name||data.email||uid} 계정을 teacher 권한으로 승인했습니다.`,"success");
      if(!requestList.children.length)await loadRequests();
    }catch(error){
      console.error(error);
      buttons.forEach(button=>button.disabled=false);
      showStatus(`교사 승인 실패\n${error.code??""}\n${error.message??String(error)}`,"error");
    }
  }

  async function rejectRequest(uid,article,...buttons){
    buttons.forEach(button=>button.disabled=true);
    try{
      await updateDoc(doc(db,"teacherRequests",uid),{
        status:"rejected",
        rejectedAt:serverTimestamp(),
        rejectedBy:masterUser.uid,
        updatedAt:serverTimestamp()
      });
      article.remove();
      showStatus("교사 등록 요청을 반려했습니다.","warning");
      if(!requestList.children.length)await loadRequests();
    }catch(error){
      console.error(error);
      buttons.forEach(button=>button.disabled=false);
      showStatus(`요청 반려 실패\n${error.code??""}\n${error.message??String(error)}`,"error");
    }
  }

  loginButton.addEventListener("click",async()=>{
    loginButton.disabled=true;
    try{await signInWithPopup(auth,provider)}catch(error){showStatus(`로그인 실패\n${error.code??""}\n${error.message??String(error)}`,"error")}finally{loginButton.disabled=false}
  });
  refreshButton.addEventListener("click",loadRequests);
  logoutButton.addEventListener("click",()=>signOut(auth));

  onAuthStateChanged(auth,async user=>{
    requestList.innerHTML="";
    if(!user){
      masterUser=null;
      loginButton.hidden=false;
      refreshButton.hidden=true;
      logoutButton.hidden=true;
      showStatus("로그인하지 않았습니다.");
      return;
    }

    try{
      const ok=await verifyMaster(user);
      if(!ok){
        masterUser=null;
        loginButton.hidden=true;
        refreshButton.hidden=true;
        logoutButton.hidden=false;
        showStatus("접근 거부: 활성 마스터 계정이 아닙니다.","error");
        return;
      }
      masterUser=user;
      loginButton.hidden=true;
      refreshButton.hidden=false;
      logoutButton.hidden=false;
      await loadRequests();
    }catch(error){
      showStatus(`마스터 권한 확인 실패\n${error.code??""}\n${error.message??String(error)}`,"error");
    }
  });
</script>
</body>
</html>
