<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OO학원 통합 홈페이지 운영모델</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173f35}
iframe{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .12s ease}
</style>
</head>
<body>
<iframe id="app" title="OO학원 홈페이지 프로토타입"></iframe>
<script>
const frame=document.getElementById('app');

const palette=`
:root{
 --navy:#173f35!important;
 --navy2:#285d4c!important;
 --gold:#e28722!important;
 --green:#b48609!important;
 --soft:#f7f6ed!important;
 --line:#e5e1d2!important;
 --shadow:0 14px 34px rgba(23,63,53,.10)!important
}
.notice,.selection,footer{background:#173f35!important}
.mark{background:linear-gradient(145deg,#173f35,#285d4c)!important}
.hero{background:linear-gradient(125deg,#e6efe9 0%,#fffaf1 58%,#fbe9c8 100%)!important}
.page-title{background:linear-gradient(120deg,#e7f0ea 0%,#fffaf1 62%,#f9e5bf 100%)!important}
.dark{background:#173f35!important}
.btn.gold{background:#e28722!important;border-color:#e28722!important;color:#24180a!important}
.notice b,.selection b{color:#d5aa22!important}
.full-ok,.status{color:#7b5a00!important;background:#fff0b8!important}
.eyebrow,.menu a.active,.program a,.choice span,.teacher-head a{color:#285d4c!important}
.filter.active,.btn.primary{background:#173f35!important;border-color:#173f35!important}
.menu{gap:18px!important}
.manager-page .page-title{border-bottom:1px solid #e5e1d2}
.manager-org{padding:38px 0 72px}
.manager-m2{border:2px solid #285d4c;border-radius:22px;padding:20px;background:#f5faf6;display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:center;margin-bottom:22px}
.manager-photo{position:relative;width:100px;height:118px;border-radius:18px;background:linear-gradient(145deg,#d7e5db,#f4e2bd);display:grid;place-items:center;overflow:hidden;border:1px solid #d8dfd9}
.manager-photo:before{content:"";position:absolute;top:18px;width:45px;height:45px;border-radius:50%;background:rgba(255,255,255,.75)}
.manager-photo:after{content:"";position:absolute;bottom:-10px;width:78px;height:68px;border-radius:42px 42px 12px 12px;background:rgba(255,255,255,.72)}
.manager-photo strong{position:relative;z-index:2;font-size:24px;color:#285d4c;margin-top:-25px}
.manager-photo small{position:absolute;z-index:3;bottom:7px;left:8px;background:#173f35;color:#fff;border-radius:6px;padding:3px 6px;font-size:9px;font-weight:900}
.manager-role{font-size:11px;font-weight:950;color:#b06a16;letter-spacing:.06em}
.manager-m2 h2,.manager-card h3{margin:4px 0 6px}
.manager-m2 h2{font-size:26px}
.manager-m2 p,.manager-card p{margin:0;color:#667085;font-size:12px}
.manager-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.manager-tags span{font-size:10px;font-weight:850;padding:5px 8px;border-radius:999px;background:#fff0b8;color:#6d5500}
.manager-teams{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.team-box{border:1px solid #e5e1d2;border-radius:20px;padding:18px;background:#fff}
.team-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.team-title h2{font-size:22px;margin:0;color:#173f35}
.team-title span{font-size:10px;font-weight:950;color:#b06a16;background:#fff2dc;padding:5px 8px;border-radius:999px}
.manager-card{border:1px solid #e5e1d2;border-radius:16px;padding:14px;margin-top:10px;background:#fffaf4}
.manager-card-top{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.manager-card .manager-photo{width:68px;height:82px;border-radius:13px}
.manager-card .manager-photo:before{top:11px;width:31px;height:31px}
.manager-card .manager-photo:after{width:53px;height:48px}
.manager-card .manager-photo strong{font-size:18px;margin-top:-17px}
.manager-card .manager-photo small{font-size:7px;left:5px;bottom:5px}
.manager-card h3{font-size:18px}
.manager-card .manager-role{font-size:10px}
.manager-detail{margin-top:12px;padding-top:11px;border-top:1px solid #ebe6d9}
.manager-detail dl{display:grid;grid-template-columns:58px 1fr;gap:5px 8px;margin:0;font-size:11px}
.manager-detail dt{font-weight:900;color:#42564c}
.manager-detail dd{margin:0;color:#6c776f}
.manager-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.manager-actions button{border:1px solid #173f35;background:#173f35;color:#fff;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:900;cursor:pointer}
.manager-actions button.alt{background:#e28722;border-color:#e28722;color:#2b1a08}
.manager-linkbar{margin-top:12px;padding:9px 11px;border-radius:10px;background:#f4f8f4;border:1px solid #dce6de;font-size:10px;color:#50645a;display:flex;justify-content:space-between;gap:10px;align-items:center}
.manager-linkbar b{color:#173f35}
.manager-linkbar button{border:0;background:transparent;color:#b06a16;font-size:10px;font-weight:950;cursor:pointer;padding:0}
#qSubject option[value="학습관리"]{font-weight:900}
@media(max-width:900px){
 .manager-teams{grid-template-columns:1fr}
 .manager-m2{grid-template-columns:90px 1fr}
 .manager-m2 .manager-actions{grid-column:1/-1}
}
@media(max-width:620px){
 .manager-m2{grid-template-columns:72px 1fr;padding:15px}
 .manager-m2 .manager-photo{width:68px;height:82px}
 .manager-m2 h2{font-size:21px}
}
`;

const managers=[
 {id:'M2',name:'박현우',rank:'M2 · 총괄 팀장',team:'전체',focus:'A·B·C팀 운영 총괄',role:'M1 관리 · 학생배정 · 월간 조정 · 입시/강사 협업',teachers:'전체 강사·매니저 연계'},
 {id:'A1',name:'김세진',rank:'M1 · A팀',team:'A',focus:'국어·수학 학습관리',role:'주간계획 · 과제이행 · 수업 선택 점검',teachers:'김도윤 · 박서현'},
 {id:'A2',name:'윤서영',rank:'M1 · A팀',team:'A',focus:'국어·수학 학습관리',role:'출결 · 상담 · 취약과목 조정',teachers:'이준호 · 정민석'},
 {id:'B1',name:'이정우',rank:'M1 · B팀',team:'B',focus:'수학 집중 학습관리',role:'수학 진도 · N제 · 오답 · 질문 추적',teachers:'최유진 · 한지훈'},
 {id:'B2',name:'최민지',rank:'M1 · B팀',team:'B',focus:'영어·학습시간 관리',role:'영어 과제 · 순공시간 · 주간 피드백',teachers:'윤하늘 · 장민아'},
 {id:'C1',name:'한도현',rank:'M1 · C팀',team:'C',focus:'탐구·성적관리',role:'탐구 진도 · 모의평가 · 성적변화 점검',teachers:'서재원'},
 {id:'C2',name:'오수진',rank:'M1 · C팀',team:'C',focus:'탐구·생활관리',role:'탐구 과제 · 출결 · 상담 · 생활리듬 점검',teachers:'오지환'}
];

const teacherManager={
 '김도윤':['A','김세진'],'박서현':['A','김세진'],
 '이준호':['A','윤서영'],'정민석':['A','윤서영'],
 '최유진':['B','이정우'],'한지훈':['B','이정우'],
 '윤하늘':['B','최민지'],'장민아':['B','최민지'],
 '서재원':['C','한도현'],'오지환':['C','오수진']
};

function managerPhoto(name){
 return `<div class="manager-photo"><strong>${name[0]}</strong><small>가상 프로필</small></div>`;
}

function managerCard(m){
 return `<article class="manager-card">
   <div class="manager-card-top">${managerPhoto(m.name)}
     <div><div class="manager-role">${m.rank}</div><h3>${m.name}</h3><p>${m.focus}</p></div>
   </div>
   <div class="manager-detail">
    <dl><dt>담당</dt><dd>${m.role}</dd><dt>강사연계</dt><dd>${m.teachers}</dd></dl>
    <div class="manager-actions">
      <button data-manager-q="${m.name}">학습관리 Q&A</button>
      <button class="alt" data-manager-profile="${m.name}">프로필</button>
    </div>
   </div>
 </article>`;
}

function managerPage(){
 const m2=managers[0];
 return `<div class="page manager-page" id="page-managers">
   <section class="page-title"><div class="wrap"><div class="eyebrow">MANAGER TEAM</div>
     <h1>강사와 함께 움직이는<br>7명의 학습 매니저</h1>
     <p>M2 팀장 1명이 전체 운영을 총괄하고, A·B·C팀에 M1 2명씩 배치합니다. 수업은 강사가, 계획·출결·과제·상담·조정은 매니저가 연결합니다.</p>
   </div></section>
   <section class="manager-org"><div class="wrap">
     <article class="manager-m2">
       ${managerPhoto(m2.name)}
       <div><div class="manager-role">${m2.rank}</div><h2>${m2.name}</h2><p>${m2.focus}</p>
        <div class="manager-tags"><span>A팀</span><span>B팀</span><span>C팀</span><span>M1 6명 관리</span><span>월간 배치조정</span></div>
       </div>
       <div class="manager-actions"><button data-manager-q="${m2.name}">팀장 Q&A</button><button class="alt" data-manager-profile="${m2.name}">프로필</button></div>
     </article>
     <div class="manager-teams">
       ${['A','B','C'].map(team=>`<section class="team-box">
         <div class="team-title"><h2>${team} TEAM</h2><span>M1 2명</span></div>
         ${managers.filter(m=>m.team===team).map(managerCard).join('')}
       </section>`).join('')}
     </div>
     <div class="foot-note"><b>역할 분리:</b> 문제풀이·수업내용은 강사 Q&A, 학습계획·출결·과제·시간표·상담은 매니저 Q&A로 연결합니다. 현재 이름과 사진은 구조 확인용 가상 프로필입니다.</div>
   </div></section>
 </div>`;
}

async function start(){
 const res=await fetch('./source.dat',{cache:'no-store'});
 let html=await res.text();
 html=html.replaceAll('송원학원','OO학원').replaceAll('SONGWON','OO ACADEMY');
 html=html.replace('</head>',`<style id="oo-theme">${palette}</style></head>`);
 frame.srcdoc=html;
}

function activateManagerPage(d){
 d.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 const p=d.getElementById('page-managers'); if(p)p.classList.add('active');
 d.querySelectorAll('.menu a').forEach(a=>a.classList.remove('active'));
 const nav=d.getElementById('managerNav'); if(nav)nav.classList.add('active');
 try{history.replaceState(null,'',location.pathname+location.search+'#managers')}catch(e){}
 d.defaultView.scrollTo({top:0,behavior:'instant'});
}

function setupManagerQ(d){
 const qSubject=d.getElementById('qSubject'),qTeacher=d.getElementById('qTeacher'),qType=d.getElementById('qType');
 if(!qSubject||!qTeacher)return;
 if(![...qSubject.options].some(o=>o.value==='학습관리')){
   const o=d.createElement('option');o.value='학습관리';o.textContent='학습관리';qSubject.appendChild(o);
 }
 const originalHandler=qSubject.onchange;
 qSubject.onchange=function(){
   if(this.value==='학습관리'){
     qTeacher.innerHTML='<option value="">매니저 선택</option>'+managers.map(m=>`<option>${m.name}</option>`).join('');
   }else if(originalHandler){originalHandler.call(this)}
 };
 d.querySelectorAll('[data-manager-q]').forEach(btn=>{
   btn.onclick=()=>{
     const name=btn.dataset.managerQ;
     frame.contentWindow.location.hash='#qna';
     setTimeout(()=>{
       qSubject.value='학습관리';
       qSubject.onchange();
       qTeacher.value=name;
       if(qType)qType.value='학습방법';
       try{history.replaceState(null,'',location.pathname+location.search+'#qna')}catch(e){}
     },20);
   };
 });
}

function setupManagerProfiles(d){
 d.querySelectorAll('[data-manager-profile]').forEach(btn=>{
   btn.onclick=()=>{
     const m=managers.find(x=>x.name===btn.dataset.managerProfile);
     if(!m)return;
     alert(`${m.name} · ${m.rank}\n\n담당: ${m.focus}\n주요 역할: ${m.role}\n강사 연계: ${m.teachers}\n\n※ 구조 검토용 가상 프로필입니다.`);
   };
 });
}

function decorateTeacherCards(d){
 const root=d.getElementById('teacherRoot'); if(!root)return;
 const apply=()=>{
   root.querySelectorAll('.teacher-card').forEach(card=>{
     if(card.querySelector('.manager-linkbar'))return;
     const h=card.querySelector('.teacher-info h3'); if(!h)return;
     const info=teacherManager[h.textContent.trim()]; if(!info)return;
     const bar=d.createElement('div');bar.className='manager-linkbar';
     bar.innerHTML=`<span><b>${info[0]}팀 M1 ${info[1]}</b> · 학습관리 담당</span><button type="button">매니저 Q&A →</button>`;
     bar.querySelector('button').onclick=()=>{
       frame.contentWindow.location.hash='#qna';
       setTimeout(()=>{
         const s=d.getElementById('qSubject'),t=d.getElementById('qTeacher'),ty=d.getElementById('qType');
         if(s&&t){s.value='학습관리';s.onchange();t.value=info[1];if(ty)ty.value='학습방법'}
       },20);
     };
     const panel=card.querySelector('.teacher-panel'); if(panel)panel.appendChild(bar);
   });
 };
 apply();
 new MutationObserver(()=>setTimeout(apply,0)).observe(root,{childList:true,subtree:true});
}

function enhance(){
 const d=frame.contentDocument;if(!d)return;
 d.title='OO학원 통합 홈페이지 운영모델';
 d.querySelectorAll('.mark').forEach(el=>{if(el.textContent.trim()==='SW')el.textContent='OO'});
 const menu=d.querySelector('.menu');
 if(menu&&!d.getElementById('managerNav')){
   const teacherLink=[...menu.querySelectorAll('a')].find(a=>a.dataset.nav==='teachers');
   const a=d.createElement('a');a.id='managerNav';a.href='javascript:void(0)';a.textContent='매니저';
   if(teacherLink&&teacherLink.nextSibling)menu.insertBefore(a,teacherLink.nextSibling);else menu.appendChild(a);
   a.onclick=()=>activateManagerPage(d);
 }
 const main=d.querySelector('main');
 if(main&&!d.getElementById('page-managers'))main.insertAdjacentHTML('beforeend',managerPage());
 setupManagerQ(d);setupManagerProfiles(d);decorateTeacherCards(d);
 const managerNav=d.getElementById('managerNav');
 if(managerNav)managerNav.onclick=()=>activateManagerPage(d);
 d.querySelectorAll('[data-nav]').forEach(el=>{
   el.addEventListener('click',()=>{if(managerNav)managerNav.classList.remove('active')});
 });
 const outer=(location.hash||'#home').slice(1);
 if(outer==='managers')activateManagerPage(d);
 else if(frame.contentWindow.location.hash!=='#'+outer)frame.contentWindow.location.hash='#'+outer;
 frame.contentWindow.addEventListener('hashchange',()=>{
   const next=frame.contentWindow.location.hash||'#home';
   if(next!=='#managers'&&location.hash!==next)history.replaceState(null,'',location.pathname+location.search+next);
 });
}

frame.addEventListener('load',()=>{
 try{enhance();frame.style.opacity='1'}catch(e){console.error(e);frame.style.opacity='1'}
});

window.addEventListener('hashchange',()=>{
 try{
   const h=(location.hash||'#home').slice(1),d=frame.contentDocument;
   if(h==='managers'){activateManagerPage(d)}
   else if(frame.contentWindow&&frame.contentWindow.location.hash!=='#'+h)frame.contentWindow.location.hash='#'+h;
 }catch(e){}
});

start().catch(()=>{document.body.innerHTML='<div style="color:white;font:16px system-ui;padding:30px">프로토타입을 불러오지 못했습니다.</div>'});
</script>
</body>
</html>
