<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OO학원 통합 홈페이지 운영모델</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173f35}#site{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="site" title="OO학원 홈페이지 프로토타입"></iframe>
<script>
const site=document.getElementById('site');
const teacherManager={
 '김도윤':'한도현','박서현':'한도현','이준호':'한도현','윤하늘':'한도현','장민아':'한도현',
 '정민석':'오수진','최유진':'오수진','한지훈':'오수진','서재원':'오수진','오지환':'오수진'
};
const managerTeachers={
 '한도현':['김도윤','박서현','이준호','윤하늘','장민아'],
 '오수진':['정민석','최유진','한지훈','서재원','오지환']
};
const m2='강민호';
const nestedDoc=()=>{try{return site.contentDocument?.getElementById('app')?.contentDocument||null}catch(e){return null}};
function goHash(hash){try{site.contentWindow.location.hash=hash;history.replaceState(null,'',location.pathname+location.search+hash)}catch(e){}}
function managerQ(name){goHash('#qna');setTimeout(()=>{const d=nestedDoc();if(!d)return;const s=d.getElementById('qSubject'),t=d.getElementById('qTeacher'),ty=d.getElementById('qType');if(!s||!t)return;s.value='단과관리';if(s.onchange)s.onchange();t.value=name;if(ty)ty.value='수업내용'},100)}
function injectStyle(d){if(d.getElementById('faculty-connect-style'))return;const s=d.createElement('style');s.id='faculty-connect-style';s.textContent=`
.faculty-manager-guide{margin:22px 0 28px;padding:16px 18px;border:1px solid #e5e1d2;border-radius:16px;background:#fffaf1;display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:11px;color:#607067}.faculty-manager-guide b{color:#173f35;font-size:13px}.faculty-manager-guide .chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.faculty-manager-guide .chain span{padding:6px 9px;border-radius:999px;background:#f0f6f1;color:#285d4c;font-weight:900}.faculty-manager-guide .chain i{font-style:normal;color:#b06a16;font-weight:950}.manager-linkbar.faculty-connected{flex-wrap:wrap}.manager-linkbar .manager-chain{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.manager-linkbar .manager-chain em{font-style:normal;color:#b06a16;font-weight:950}.manager-linkbar .manager-buttons{display:flex;gap:8px;flex-wrap:wrap}.manager-linkbar .manager-buttons button{border:0;background:transparent;color:#b06a16;font-size:10px;font-weight:950;cursor:pointer;padding:0}.manager-linkbar .manager-buttons button.m2{color:#285d4c}.teacher-card.linked-teacher{outline:3px solid #e28722;outline-offset:2px;box-shadow:0 12px 28px rgba(226,135,34,.16)}.linked-note{margin:0 0 18px;padding:10px 12px;border-radius:11px;background:#fff2dc;color:#75470e;font-size:11px;font-weight:850}@media(max-width:620px){.faculty-manager-guide{align-items:flex-start;flex-direction:column}}`;d.head.appendChild(s)}
function addGuide(d){const page=d.getElementById('page-teachers');if(!page||d.getElementById('facultyManagerGuide'))return;const wrap=page.querySelector('section.block .wrap');if(!wrap)return;const g=d.createElement('div');g.id='facultyManagerGuide';g.className='faculty-manager-guide';g.innerHTML='<div><b>강사진–단과관리 연결</b><div>수업은 강사가 담당하고, 수강·강좌·과제·공지·변경은 단과관리팀이 이어서 관리합니다.</div></div><div class="chain"><span>강사</span><i>→</i><span>M1 단과관리</span><i>→</i><span>M2 단과관리팀장</span><i>→</i><span>Q&A</span></div>';wrap.insertBefore(g,wrap.firstChild)}
function connectTeacherCards(d){const root=d.getElementById('teacherRoot');if(!root)return;root.querySelectorAll('.teacher-card').forEach(card=>{const h=card.querySelector('.teacher-info h3');if(!h)return;const teacher=h.textContent.trim(),m1=teacherManager[teacher];if(!m1)return;const panel=card.querySelector('.teacher-panel');if(!panel)return;let bar=panel.querySelector('.manager-linkbar');if(!bar){bar=d.createElement('div');bar.className='manager-linkbar';panel.appendChild(bar)}if(bar.classList.contains('faculty-connected'))return;bar.classList.add('faculty-connected');bar.innerHTML=`<div class="manager-chain"><b>M1 ${m1}</b><span>단과관리</span><em>→</em><b>M2 ${m2}</b><span>단과관리팀장</span></div><div class="manager-buttons"><button data-m1>담당 M1 Q&A</button><button class="m2" data-m2>M2 팀장 Q&A</button><button data-org>매니저 조직 보기</button></div>`;bar.querySelector('[data-m1]').onclick=()=>managerQ(m1);bar.querySelector('[data-m2]').onclick=()=>managerQ(m2);bar.querySelector('[data-org]').onclick=()=>goHash('#managers')})}
function showTeachers(names){goHash('#teachers');setTimeout(()=>{const d=nestedDoc();if(!d)return;const all=d.querySelector('#teacherFilters [data-filter="전체"]');if(all)all.click();setTimeout(()=>{const root=d.getElementById('teacherRoot');if(!root)return;root.querySelectorAll('.teacher-card').forEach(c=>c.classList.remove('linked-teacher'));const old=d.getElementById('linkedTeacherNote');if(old)old.remove();root.querySelectorAll('.teacher-card').forEach(card=>{const h=card.querySelector('.teacher-info h3');if(h&&(!names||names.includes(h.textContent.trim())))card.classList.add('linked-teacher')});const n=d.createElement('div');n.id='linkedTeacherNote';n.className='linked-note';n.textContent=names?'담당 연결 강사진: '+names.join(' · '):'단과관리팀장이 총괄하는 전체 강사진입니다.';root.parentElement.insertBefore(n,root);const first=root.querySelector('.linked-teacher');if(first)first.scrollIntoView({behavior:'smooth',block:'center'})},70)},100)}
function connectManagerCards(d){d.querySelectorAll('.manager-card').forEach(card=>{const h=card.querySelector('h3');if(!h)return;const name=h.textContent.trim(),names=managerTeachers[name];if(!names||card.querySelector('[data-faculty-link]'))return;const acts=card.querySelector('.manager-actions');if(!acts)return;const b=d.createElement('button');b.type='button';b.className='alt';b.dataset.facultyLink='1';b.textContent='연결 강사진';b.onclick=()=>showTeachers(names);acts.insertBefore(b,acts.lastElementChild)});d.querySelectorAll('.manager-m2').forEach(card=>{const h=card.querySelector('h2');if(!h||h.textContent.trim()!==m2||card.querySelector('[data-faculty-link]'))return;const acts=card.querySelector('.manager-actions');if(!acts)return;const b=d.createElement('button');b.type='button';b.className='alt';b.dataset.facultyLink='1';b.textContent='전체 강사진';b.onclick=()=>showTeachers(null);acts.insertBefore(b,acts.lastElementChild)})}
function enhance(){const d=nestedDoc();if(!d)return;injectStyle(d);addGuide(d);connectTeacherCards(d);connectManagerCards(d);const root=d.getElementById('teacherRoot');if(root&&!root.dataset.facultyObserver){root.dataset.facultyObserver='1';new MutationObserver(()=>setTimeout(()=>connectTeacherCards(d),0)).observe(root,{childList:true,subtree:true})}}
function boot(){site.src='./base-v2.html'+(location.hash||'#home');let tries=0;const timer=setInterval(()=>{tries++;enhance();if(tries>240)clearInterval(timer)},250)}
site.addEventListener('load',()=>setTimeout(enhance,350));window.addEventListener('hashchange',()=>{try{if(site.contentWindow.location.hash!==location.hash)site.contentWindow.location.hash=location.hash}catch(e){};setTimeout(enhance,250)});boot();
</script>
</body>
</html>
