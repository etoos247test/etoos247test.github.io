<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OO학원 통합 홈페이지 운영모델</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173f35}#site{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="site" title="OO학원 홈페이지 프로토타입"></iframe>
<script>
const site=document.getElementById('site');
const teacherManager={
 '김도윤':'한도현','박서현':'한도현','이준호':'한도현','윤하늘':'한도현','장민아':'한도현',
 '정민석':'오수진','최유진':'오수진','한지훈':'오수진','서재원':'오수진','오지환':'오수진'
};
const teacherSubject={
 '김도윤':'국어','박서현':'국어','이준호':'국어',
 '정민석':'수학','최유진':'수학','한지훈':'수학',
 '윤하늘':'영어','장민아':'영어','서재원':'탐구','오지환':'탐구'
};
function appDoc(){
 try{
  const d1=site.contentDocument;
  const inner=d1?.getElementById('site');
  const d2=inner?.contentDocument;
  const app=d2?.getElementById('app');
  return app?.contentDocument||null;
 }catch(e){return null}
}
function goHash(hash){
 try{site.contentWindow.location.hash=hash;history.replaceState(null,'',location.pathname+location.search+hash)}catch(e){}
}
function managerQ(name){
 goHash('#qna');
 setTimeout(()=>{
  const d=appDoc();if(!d)return;
  const s=d.getElementById('qSubject'),t=d.getElementById('qTeacher'),ty=d.getElementById('qType');
  if(!s||!t)return;
  s.value='단과관리';if(s.onchange)s.onchange();t.value=name;if(ty)ty.value='수업내용';
 },180);
}
function teacherQ(name){
 goHash('#qna');
 setTimeout(()=>{
  const d=appDoc();if(!d)return;
  const s=d.getElementById('qSubject'),t=d.getElementById('qTeacher'),ty=d.getElementById('qType');
  if(!s||!t)return;
  s.value=teacherSubject[name]||'';if(s.onchange)s.onchange();t.value=name;if(ty)ty.value='수업내용';
 },180);
}
function showCourse(name){
 goHash('#courses');
 setTimeout(()=>{
  const d=appDoc();if(!d)return;
  const all=d.querySelector('#courseFilters [data-filter="전체"]');if(all)all.click();
  setTimeout(()=>{
   d.querySelectorAll('.teacher-section').forEach(x=>x.classList.remove('student-course-focus'));
   const old=d.getElementById('studentCourseNote');if(old)old.remove();
   const sec=[...d.querySelectorAll('.teacher-section')].find(x=>x.querySelector('.teacher-head h2')?.textContent.trim().startsWith(name));
   if(!sec)return;
   sec.classList.add('student-course-focus');
   const note=d.createElement('div');note.id='studentCourseNote';note.className='student-course-note';note.textContent=name+' 선생님의 개설강좌입니다. 강좌를 선택한 뒤 담당 단과 M1과 수강 상담을 이어갈 수 있습니다.';
   sec.parentElement.insertBefore(note,sec);sec.scrollIntoView({behavior:'smooth',block:'center'});
  },100);
 },160);
}
function injectStyle(d){
 if(d.getElementById('student-faculty-flow-style'))return;
 const s=d.createElement('style');s.id='student-faculty-flow-style';s.textContent=`
.student-flow{margin-top:12px;border:1px solid #e3dfcf;border-radius:13px;background:#fffaf0;overflow:hidden}
.student-flow-title{padding:8px 11px;background:#173f35;color:#fff;font-size:10px;font-weight:950;letter-spacing:.03em}
.student-flow-steps{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:stretch}
.student-flow-step{border:0;background:#fffaf0;padding:10px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.student-flow-step:hover{background:#f3f7f2}
.student-flow-step span{font-size:9px;color:#b06a16;font-weight:950}
.student-flow-step b{font-size:11px;color:#173f35}
.student-flow-step small{font-size:9px;color:#7a817c}
.student-flow-arrow{display:grid;place-items:center;color:#d18a24;font-weight:950;background:#fff4dc;font-style:normal}
.student-course-focus{outline:3px solid #e28722;outline-offset:4px;border-radius:16px;box-shadow:0 14px 32px rgba(226,135,34,.14)}
.student-course-note{margin:0 0 15px;padding:11px 13px;border-radius:11px;background:#fff0b8;color:#69520a;font-size:11px;font-weight:850}
@media(max-width:620px){.student-flow-steps{grid-template-columns:1fr}.student-flow-arrow{height:18px;transform:rotate(90deg)}}
`;
 d.head.appendChild(s);
}
function connectFlows(d){
 const root=d.getElementById('teacherRoot');if(!root)return;
 root.querySelectorAll('.teacher-card').forEach(card=>{
  const h=card.querySelector('.teacher-info h3');if(!h)return;
  const teacher=h.textContent.trim(),m1=teacherManager[teacher];if(!m1)return;
  const panel=card.querySelector('.teacher-panel');if(!panel||panel.querySelector('.student-flow'))return;
  const flow=d.createElement('div');flow.className='student-flow';
  flow.innerHTML=`<div class="student-flow-title">학생 이용 동선</div><div class="student-flow-steps"><button class="student-flow-step" data-course><span>01</span><b>개설강좌 보기</b><small>${teacher} 강좌 확인</small></button><i class="student-flow-arrow">→</i><button class="student-flow-step" data-m1><span>02</span><b>M1 ${m1}</b><small>수강·강좌 관리</small></button><i class="student-flow-arrow">→</i><button class="student-flow-step" data-teacherq><span>03</span><b>강사 Q&A</b><small>수업·문제 질문</small></button></div>`;
  flow.querySelector('[data-course]').onclick=()=>showCourse(teacher);
  flow.querySelector('[data-m1]').onclick=()=>managerQ(m1);
  flow.querySelector('[data-teacherq]').onclick=()=>teacherQ(teacher);
  panel.appendChild(flow);
 });
}
function enhance(){
 const d=appDoc();if(!d)return;
 injectStyle(d);connectFlows(d);
 const root=d.getElementById('teacherRoot');
 if(root&&!root.dataset.studentFlowObserver){
  root.dataset.studentFlowObserver='1';
  new MutationObserver(()=>setTimeout(()=>connectFlows(d),0)).observe(root,{childList:true,subtree:true});
 }
}
function boot(){
 site.src='./faculty-v3-base.html'+(location.hash||'#home');
 let tries=0;const timer=setInterval(()=>{tries++;enhance();if(tries>260)clearInterval(timer)},250);
}
site.addEventListener('load',()=>setTimeout(enhance,500));
window.addEventListener('hashchange',()=>{try{if(site.contentWindow.location.hash!==location.hash)site.contentWindow.location.hash=location.hash}catch(e){};setTimeout(enhance,350)});
boot();
</script>
</body>
</html>
