<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OO학원 통합 홈페이지 운영모델</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173f35}iframe{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .12s ease}</style>
</head>
<body>
<iframe id="app" title="OO학원 홈페이지 프로토타입"></iframe>
<script>
const frame=document.getElementById('app');
const palette=`
:root{--navy:#173f35!important;--navy2:#285d4c!important;--gold:#e28722!important;--green:#b48609!important;--soft:#f7f6ed!important;--line:#e5e1d2!important;--shadow:0 14px 34px rgba(23,63,53,.10)!important}
.notice,.selection,footer{background:#173f35!important}
.mark{background:linear-gradient(145deg,#173f35,#285d4c)!important}
.hero{background:linear-gradient(125deg,#e6efe9 0%,#fffaf1 58%,#fbe9c8 100%)!important}
.page-title{background:linear-gradient(120deg,#e7f0ea 0%,#fffaf1 62%,#f9e5bf 100%)!important}
.dark{background:#173f35!important}
.btn.gold{background:#e28722!important;border-color:#e28722!important;color:#24180a!important}
.notice b,.selection b{color:#d5aa22!important}
.full-ok,.status{color:#7b5a00!important;background:#fff0b8!important}
.eyebrow,.menu a.active,.program a,.choice span,.teacher-head a{color:#285d4c!important}
.filter.active,.btn.primary{background:#173f35!important;border-color:#173f35!important}
`;
function replaceTextNode(n){if(!n.nodeValue)return;const v=n.nodeValue.replace(/송원학원/g,'OO학원').replace(/SONGWON/g,'OO ACADEMY');if(v!==n.nodeValue)n.nodeValue=v}
function scrub(root){const d=frame.contentDocument;if(!d||!root)return;const walker=d.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||['SCRIPT','STYLE','NOSCRIPT'].includes(p.tagName))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(replaceTextNode);d.querySelectorAll('.mark').forEach(el=>{if(el.textContent.trim()==='SW')el.textContent='OO'});d.title='OO학원 통합 홈페이지 운영모델'}
function applyTheme(){const d=frame.contentDocument;if(!d)return;const st=d.createElement('style');st.id='oo-theme';st.textContent=palette;d.head.appendChild(st);scrub(d.body);const obs=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')replaceTextNode(m.target);m.addedNodes.forEach(n=>{if(n.nodeType===3)replaceTextNode(n);else if(n.nodeType===1)scrub(n)})}});obs.observe(d.body,{subtree:true,childList:true,characterData:true});frame.style.opacity='1';frame.contentWindow.addEventListener('hashchange',()=>{const h=frame.contentWindow.location.hash||'#home';if(location.hash!==h)history.replaceState(null,'',location.pathname+location.search+h)})}
frame.addEventListener('load',applyTheme);
frame.src='./app.html'+(location.hash||'#home');
window.addEventListener('hashchange',()=>{if(frame.contentWindow&&frame.contentWindow.location.hash!==location.hash)frame.contentWindow.location.hash=location.hash||'#home'});
</script>
</body>
</html>
