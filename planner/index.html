<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>이투스247 수성 플래너</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#dfe5ea;--green:#17382d;--bg:#f3f6f4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}
.shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 12%,#fff 0,#f6f8f6 34%,transparent 55%),linear-gradient(135deg,#edf3ef,#f7f8fa)}
.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(20,45,34,.12);padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:52px;height:52px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:950;font-size:20px}.brand small{display:block;color:var(--muted);font-weight:800;letter-spacing:.08em}.brand h1{font-size:22px;margin:3px 0 0;letter-spacing:-.04em}
.intro{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.65}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.role{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:900;color:#65716b;cursor:pointer}.role.active{background:var(--green);border-color:var(--green);color:#fff}
form{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900;color:#56635c}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;background:#fff}.field input:focus{border-color:#618678;box-shadow:0 0 0 3px rgba(63,109,91,.12)}
.submit{border:0;background:var(--green);color:#fff;border-radius:13px;padding:14px;font-weight:950;cursor:pointer;margin-top:4px}.submit:disabled{opacity:.55;cursor:default}.status{min-height:22px;margin:12px 0 0;font-size:13px;font-weight:800;color:var(--muted)}.status.error{color:#b42318}.status.ok{color:#157347}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #edf0ee;font-size:12px;color:var(--muted)}.foot a{color:var(--green);font-weight:900;text-decoration:none}
#loading{display:none;text-align:center}.spinner{width:34px;height:34px;border:4px solid #dce5e0;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:4px auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){.shell{padding:14px}.card{border-radius:20px;padding:22px}.brand h1{font-size:20px}}
</style>
</head>
<body>
<div class="shell">
  <section class="card" id="loginCard">
    <div class="brand"><div class="mark">247</div><div><small>ETOOS247 SUSEONG</small><h1>이투스247 수성 플래너</h1></div></div>
    <p class="intro">학원에서 발급받은 ID와 비밀번호로 로그인하세요. 메인 학원생활 도우미와 같은 계정을 사용합니다.</p>
    <div class="roles" role="group" aria-label="사용자 유형"><button class="role active" id="studentRole" type="button">학생</button><button class="role" id="teacherRole" type="button">교사</button></div>
    <form id="loginForm">
      <div class="field"><label for="loginId">ID</label><input id="loginId" name="loginId" autocomplete="username" placeholder="학생 ID" required></div>
      <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="5" placeholder="비밀번호" required></div>
      <button class="submit" id="loginBtn" type="submit">학생 로그인</button>
    </form>
    <div class="status" id="status">로그인하면 플래너가 바로 열립니다.</div>
    <div class="foot"><span>기존 로그인 세션이 있으면 자동 연결됩니다.</span><a href="../">학원생활 도우미</a></div>
  </section>
  <section class="card" id="loading"><div class="spinner"></div><b>플래너를 불러오는 중입니다.</b><p class="intro">로그인 정보를 확인하고 있습니다.</p></section>
</div>
<script>
(()=>{
const API='https://my247-api.etoos247test.workers.dev',TK='my247Session';
const files=['./assets/app-20260813-0.txt','./assets/app-20260813-1.txt','./assets/app-20260813-2.txt','./assets/app-20260813-3.txt','./assets/app-20260813-4a.txt','./assets/app-20260813-4b.txt','./assets/app-20260813-4c.txt','./assets/app-20260813-5.txt'];
const loginCard=document.getElementById('loginCard'),loading=document.getElementById('loading'),form=document.getElementById('loginForm'),status=document.getElementById('status'),loginId=document.getElementById('loginId'),loginBtn=document.getElementById('loginBtn'),studentRole=document.getElementById('studentRole'),teacherRole=document.getElementById('teacherRole');
let role='student';
function setRole(next){role=next;studentRole.classList.toggle('active',role==='student');teacherRole.classList.toggle('active',role==='teacher');loginId.placeholder=role==='student'?'학생 ID':'교사 ID';loginBtn.textContent=role==='student'?'학생 로그인':'교사 로그인';status.textContent='로그인하면 플래너가 바로 열립니다.';status.className='status'}
studentRole.onclick=()=>setRole('student');teacherRole.onclick=()=>setRole('teacher');
function setStatus(msg,kind=''){status.textContent=msg;status.className='status '+kind}
async function req(path,opt={}){const r=await fetch(API+path,{...opt,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`서버 오류 ${r.status}`);return d}
async function validSession(){const token=sessionStorage.getItem(TK)||'';if(!token)return false;try{const r=await fetch(API+'/api/me',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();return !!d?.user?.loginId}catch{sessionStorage.removeItem(TK);return false}}
async function loadPlanner(){loginCard.style.display='none';loading.style.display='block';try{const parts=await Promise.all(files.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('플래너 파일을 찾을 수 없습니다.');return r.text()})));const b64=parts.join('').trim(),bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('이 브라우저에서는 플래너 압축 해제를 지원하지 않습니다.');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){loading.innerHTML=`<b>플래너를 불러오지 못했습니다.</b><p class="intro">${String(e.message||e)}</p><p><a href="./">다시 시도</a></p>`}}
form.addEventListener('submit',async e=>{e.preventDefault();loginBtn.disabled=true;setStatus('계정을 확인하는 중입니다.');try{const d=await req('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({loginId:form.loginId.value.trim(),password:form.password.value,mode:role==='student'?'student':'staff'})});if(role==='student'&&d?.user?.role!=='student')throw new Error('학생 계정으로 로그인해 주세요.');if(role==='teacher'&&d?.user?.role!=='teacher')throw new Error('교사 계정으로 로그인해 주세요.');if(!d?.token)throw new Error('로그인 토큰을 받지 못했습니다.');sessionStorage.setItem(TK,d.token);setStatus('로그인되었습니다.','ok');await loadPlanner()}catch(err){setStatus(err.message||'로그인에 실패했습니다.','error')}finally{loginBtn.disabled=false}});
(async()=>{if(await validSession())await loadPlanner()})();
})();
</script>
</body>
</html>
