<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이투스247 수성 플래너</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#18221d;--muted:#68746d;--line:#dfe4e1;--accent:#17382d;--hour:54px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
body.mono{filter:grayscale(1)}.wrap{max-width:1700px;margin:auto;padding:18px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(24px,3vw,40px);letter-spacing:-.06em}.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:800}.btn.dark{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#a52d2d}.toolbar{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .note{margin-left:auto;color:var(--muted);font-size:12px}.board{display:grid;grid-template-columns:118px repeat(7,minmax(150px,1fr));min-width:1200px;background:#fff}.scroll{overflow:auto;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px rgba(25,39,31,.07)}.head,.corner{position:sticky;top:0;z-index:20;height:54px;background:#fff;border-bottom:1px solid var(--line);display:grid;place-items:center;font-weight:900}.corner{left:0;z-index:30;border-right:1px solid var(--line)}.head{border-right:1px solid var(--line)}.head small{font-size:9px;color:#8a958f}.timecol{position:sticky;left:0;z-index:10;height:calc(var(--hour)*18);background:#fff;border-right:1px solid var(--line)}.time{position:absolute;left:0;right:0;height:var(--hour);border-bottom:1px solid var(--line);padding:6px 8px;color:#728079;font-size:10px;font-weight:800}.day{position:relative;height:calc(var(--hour)*18);border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff calc(var(--hour) - 1px),#e7ebe8 calc(var(--hour) - 1px),#e7ebe8 var(--hour))}.day.sunday:before{content:"일요일 운영 09:00~18:00";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(120,130,125,.14) 0,rgba(120,130,125,.14) 16.66%,transparent 16.66%,transparent 66.66%,rgba(120,130,125,.14) 66.66%,rgba(120,130,125,.14) 100%);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;color:#6b746f;font-size:10px;font-weight:900}.event{position:absolute;left:5px;right:5px;border-radius:9px;padding:6px 7px;overflow:hidden;border:1px solid rgba(0,0,0,.08);box-shadow:0 3px 10px rgba(21,34,27,.10);font-size:11px}.event b{display:block;font-size:12px}.event span{display:block;font-size:9px;opacity:.72;margin-top:2px}.subject-kor{background:#e9f2ff}.subject-eng{background:#fff1e7}.subject-math{background:#edf7ed}.subject-social{background:#f5edff}.subject-science{background:#e8f8f7}.subject-other{background:#f1f2f4}.footer-note{font-size:11px;color:var(--muted);margin:9px 2px 0}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 26px));box-shadow:0 30px 90px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(13,23,18,.45)}.modal{padding:20px}.modal h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#59675f}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.error{display:none;background:#fff0f0;color:#9c2727;border:1px solid #f1c2c2;padding:9px;border-radius:9px;font-size:11px;font-weight:800;margin-bottom:10px}.error.show{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.stat small{color:var(--muted);font-size:10px}.stat strong{display:block;font-size:22px;margin-top:4px}.timer-display{text-align:center;font-size:clamp(52px,10vw,88px);font-weight:950;letter-spacing:-.05em;margin:22px 0}.timer-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.timer-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;align-items:end}.timer-row .field{min-width:130px}
@media(max-width:800px){.wrap{padding:10px}.toolbar .note{width:100%;margin:0}.stats{grid-template-columns:1fr}.brand p{font-size:11px}}
@media print{.actions,.toolbar,.footer-note{display:none}.wrap{max-width:none;padding:0}.scroll{box-shadow:none;border:0}.board{min-width:0}.corner,.head,.timecol{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><h1>이투스247 수성 플래너</h1><p>06:00~24:00 · 일요일 09:00~18:00 · 과목별 계획 관리 · 수성타이머</p></div><div class="actions">
    <a class="btn" href="../">← 학원생활 도우미</a><button class="btn dark" id="addBtn">+ 일정 추가</button><button class="btn" id="statsBtn">학습 통계</button><button class="btn" id="timerBtn">이투스247 수성타이머</button><button class="btn" id="monoBtn">흑백모드</button><button class="btn" id="exportBtn">시간표 백업</button><button class="btn" id="importBtn">시간표 복원</button><button class="btn" onclick="print()">인쇄 / PDF</button><button class="btn danger" id="resetBtn">전체 초기화</button><input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div></div>
  <div class="toolbar"><b>주간 플래너</b><span class="note">과목: 국어 · 영어 · 수학 · 사탐 · 과탐 · 기타 / 일정은 브라우저에 자동 저장됩니다.</span></div>
  <div class="scroll"><div class="board" id="board"></div></div><p class="footer-note">※ 일요일은 09:00~18:00 이외 시간에 일정을 등록할 수 없습니다.</p>
</div>

<dialog id="eventDialog"><form method="dialog" class="modal" id="eventForm"><h2>일정 추가</h2><div class="error" id="eventError"></div><div class="grid">
<div class="field full"><label>일정명</label><input id="eventName" required maxlength="40" placeholder="예: 수학 미적분"></div>
<div class="field"><label>요일</label><select id="eventDay"></select></div><div class="field"><label>과목</label><select id="eventSubject"><option>국어</option><option>영어</option><option>수학</option><option>사탐</option><option>과탐</option><option>기타</option></select></div>
<div class="field"><label>시작</label><input id="eventStart" type="time" step="300" value="09:00"></div><div class="field"><label>종료</label><input id="eventEnd" type="time" step="300" value="10:00"></div>
</div><div class="modal-actions"><button class="btn" value="cancel">취소</button><button class="btn dark" id="saveEventBtn" value="default">저장</button></div></form></dialog>

<dialog id="statsDialog"><div class="modal"><h2>학습 통계</h2><div class="stats" id="statsGrid"></div><div class="modal-actions"><span></span><button class="btn" onclick="statsDialog.close()">닫기</button></div></div></dialog>

<dialog id="timerDialog"><div class="modal"><h2>이투스247 수성타이머</h2><div class="timer-row"><div class="field"><label>과목</label><select id="timerSubject"><option>국어</option><option>영어</option><option>수학</option><option>사탐</option><option>과탐</option><option>기타</option></select></div><div class="field"><label>모드</label><select id="timerMode"><option value="up">정방향</option><option value="down">역방향</option></select></div><div class="field"><label>제한시간(분)</label><input id="timerMinutes" type="number" min="1" max="720" value="60"></div></div><div class="timer-display" id="timerDisplay">00:00:00</div><div class="timer-actions"><button class="btn dark" id="timerStart">시작</button><button class="btn" id="timerPause">일시정지</button><button class="btn" id="timerSave">종료·저장</button><button class="btn" id="timerReset">리셋</button></div><div class="modal-actions"><span></span><button class="btn" onclick="timerDialog.close()">닫기</button></div></div></dialog>

<script>
(()=>{
const DAYS=['월','화','수','목','금','토','일'],SUBS=['국어','영어','수학','사탐','과탐','기타'],KEY='etoos247_suseong_planner_v1';
const cmap={국어:'kor',영어:'eng',수학:'math',사탐:'social',과탐:'science',기타:'other'};let data=load(),timer={running:false,start:0,base:0,interval:null};
const $=id=>document.getElementById(id);function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.events))return x}catch{}return{events:[],logs:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function min(t){const [h,m]=t.split(':').map(Number);return h*60+m}function hhmm(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);return [h,m,x].map(v=>String(v).padStart(2,'0')).join(':')}
function render(){const b=$('board');b.innerHTML='<div class="corner">시간</div>'+DAYS.map((d,i)=>`<div class="head">${d}<small>${i<5?'WEEKDAY':'WEEKEND'}</small></div>`).join('');const tc=document.createElement('div');tc.className='timecol';for(let h=6;h<24;h++){const x=document.createElement('div');x.className='time';x.style.top=((h-6)*54)+'px';x.textContent=String(h).padStart(2,'0')+':00';tc.appendChild(x)}b.appendChild(tc);DAYS.forEach((d,di)=>{const col=document.createElement('div');col.className='day'+(di===6?' sunday':'');data.events.filter(e=>e.day===di).forEach(e=>{const s=min(e.start),en=min(e.end),el=document.createElement('div');el.className='event subject-'+cmap[e.subject];el.style.top=((s-360)/60*54)+'px';el.style.height=Math.max(24,(en-s)/60*54-2)+'px';el.innerHTML=`<b>${e.name}</b><span>${e.start}~${e.end} · ${e.subject}</span>`;el.title='더블클릭하면 삭제';el.ondblclick=()=>{if(confirm('이 일정을 삭제할까요?')){data.events=data.events.filter(x=>x.id!==e.id);save();render()}};col.appendChild(el)});b.appendChild(col)})}
DAYS.forEach((d,i)=>$('eventDay').insertAdjacentHTML('beforeend',`<option value="${i}">${d}요일</option>`));
$('addBtn').onclick=()=>{$('eventError').classList.remove('show');$('eventDialog').showModal()};$('saveEventBtn').onclick=e=>{e.preventDefault();const name=$('eventName').value.trim(),day=+$('eventDay').value,subject=$('eventSubject').value,start=$('eventStart').value,end=$('eventEnd').value,err=$('eventError');let msg='';if(!name)msg='일정명을 입력하세요.';else if(!start||!end||min(end)<=min(start))msg='종료시간은 시작시간보다 늦어야 합니다.';else if(day===6&&(min(start)<540||min(end)>1080))msg='일요일은 09:00~18:00까지만 운영합니다.';if(msg){err.textContent=msg;err.classList.add('show');return}data.events.push({id:Date.now()+'_'+Math.random(),name,day,subject,start,end});save();render();$('eventForm').reset();$('eventStart').value='09:00';$('eventEnd').value='10:00';$('eventDialog').close()};
$('resetBtn').onclick=()=>{if(confirm('모든 시간표와 타이머 기록을 삭제할까요?')){data={events:[],logs:[]};save();render()}};$('monoBtn').onclick=()=>document.body.classList.toggle('mono');
$('exportBtn').onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='이투스247_수성_플래너_백업.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.events))throw 0;data={events:x.events,logs:Array.isArray(x.logs)?x.logs:[]};save();render();alert('시간표를 복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};
function stats(){const sums=Object.fromEntries(SUBS.map(s=>[s,0]));data.events.forEach(e=>sums[e.subject]+=(min(e.end)-min(e.start)));const timerSums=Object.fromEntries(SUBS.map(s=>[s,0]));data.logs.forEach(l=>timerSums[l.subject]+=l.seconds||0);$('statsGrid').innerHTML=SUBS.map(s=>`<div class="stat"><small>${s}</small><strong>${Math.floor(sums[s]/60)}시간 ${sums[s]%60}분</strong><span>타이머 ${(timerSums[s]/3600).toFixed(1)}시간</span></div>`).join('');$('statsDialog').showModal()}$('statsBtn').onclick=stats;
function timerSeconds(){if(!timer.running)return timer.base;return timer.base+(Date.now()-timer.start)/1000}function drawTimer(){let sec=timerSeconds();if($('timerMode').value==='down'){const max=Math.max(60,(+$('timerMinutes').value||60)*60);sec=Math.max(0,max-sec);if(sec<=0&&timer.running){timer.base=max;timer.running=false;clearInterval(timer.interval)}}$('timerDisplay').textContent=hhmm(sec)}function pulse(){clearInterval(timer.interval);timer.interval=setInterval(drawTimer,250);drawTimer()}
$('timerBtn').onclick=()=>{$('timerDialog').showModal();drawTimer()};$('timerStart').onclick=()=>{if(timer.running)return;timer.running=true;timer.start=Date.now();pulse()};$('timerPause').onclick=()=>{if(!timer.running)return;timer.base=timerSeconds();timer.running=false;clearInterval(timer.interval);drawTimer()};$('timerReset').onclick=()=>{timer.running=false;timer.base=0;clearInterval(timer.interval);drawTimer()};$('timerSave').onclick=()=>{const elapsed=$('timerMode').value==='down'?Math.max(0,(+$('timerMinutes').value||60)*60-(parseInt($('timerDisplay').textContent.split(':')[0])*3600+parseInt($('timerDisplay').textContent.split(':')[1])*60+parseInt($('timerDisplay').textContent.split(':')[2]))):timerSeconds();if(elapsed>1){data.logs.push({id:Date.now(),subject:$('timerSubject').value,seconds:Math.round(elapsed),createdAt:Date.now()});save()}timer.running=false;timer.base=0;clearInterval(timer.interval);drawTimer();$('timerDialog').close()};$('timerMode').onchange=drawTimer;$('timerMinutes').oninput=drawTimer;render();
})();
</script>
</body>
</html>
