<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이투스247 수성 플래너</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#172033}
#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#load b{font-size:20px}#load p{color:#6b7280}
</style>
</head>
<body>
<div id="load"><div><b>이투스247 수성 플래너</b><p>플래너를 불러오는 중입니다.</p></div></div>
<script>
(async()=>{
 try{
  const files=[
   './assets/app-20260813-0.txt',
   './assets/app-20260813-1.txt',
   './assets/app-20260813-2.txt',
   './assets/app-20260813-3.txt',
   './assets/app-20260813-4.txt',
   './assets/app-20260813-5.txt'
  ];
  const parts=await Promise.all(files.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));
  const b64=parts.join('').trim();
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('browser');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('load').innerHTML='<div><b>플래너를 불러오지 못했습니다.</b><p>브라우저를 새로고침하거나 최신 Chrome/Safari/Edge에서 다시 접속해 주세요.</p><p><a href="../">메인으로 돌아가기</a></p></div>';
 }
})();
</script>
</body>
</html>
