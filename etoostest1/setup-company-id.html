<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>회사 ID 시험계정 준비</title><link rel="stylesheet" href="./styles.css?v=20260809a"><style>.setup-page{max-width:760px;margin:70px auto;padding:0 24px}.setup-box{padding:34px;border:1px solid #dce8e0;border-radius:28px;background:#fff;box-shadow:0 18px 50px rgba(30,60,45,.08)}.setup-box h1{font-size:34px;letter-spacing:-.04em;margin:10px 0}.setup-box p{color:#6e7c74;line-height:1.7}.setup-form{display:grid;gap:14px;margin-top:24px}.setup-form label{display:grid;gap:7px;font-size:12px;font-weight:800}.setup-form input{padding:14px;border:1px solid #cbd9d0;border-radius:12px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.actions a{border:0;border-radius:12px;padding:13px 16px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:#173e31;color:#fff}.secondary{background:#edf4f0;color:#294b3c}.statusbox{margin-top:16px;padding:13px;border-radius:12px;background:#f3f7f5;color:#496057;white-space:pre-wrap;font-size:13px}</style></head><body><div class="setup-page"><a href="./" style="color:#557066;text-decoration:none;font-size:12px">← 시험버전 1</a><section class="setup-box"><span class="version">TRANSITION SETUP</span><h1>기존 마스터에<br>회사 ID를 연결합니다.</h1><p>이 화면은 Firebase를 없애기 위한 전환 준비용입니다. 먼저 기존 Google/Firebase 마스터로 로그인한 뒤, 같은 사용자 UID에 회사 ID와 임시 비밀번호를 연결합니다.</p><div class="actions"><button id="googleBtn" class="primary">기존 Google 관리자 로그인</button></div><form id="setupForm" class="setup-form"><label>회사 ID<input id="loginId" placeholder="ADMIN001" autocomplete="username" required></label><label>임시 비밀번호<input id="password" type="password" minlength="10" placeholder="10자 이상" required></label><div class="actions"><button class="primary" type="submit">회사 ID 연결</button><a class="secondary" href="../etoostest2/">2안 로그인 화면 보기</a></div></form><div id="status" class="statusbox">기존 마스터 로그인부터 진행하세요.</div></section></div><script type="module">
import { onAuthStateChanged, signInWithPopup } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import { auth, authPersistenceReady, provider } from '../question-access/firebase-client.js';
const API='https://etoos247-qa-api.etoos247test.workers.dev';
const status=document.getElementById('status');let user=null;
document.getElementById('googleBtn').onclick=async()=>{try{await authPersistenceReady;await signInWithPopup(auth,provider)}catch(e){status.textContent='로그인 실패\n'+(e.message||e)}};
onAuthStateChanged(auth,u=>{user=u;status.textContent=u?`로그인됨: ${u.email||u.uid}\n회사 ID를 입력해 연결할 수 있습니다.`:'기존 마스터 로그인부터 진행하세요.'});
document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();if(!user){status.textContent='먼저 기존 Google 관리자 로그인을 하세요.';return}try{const token=await user.getIdToken();const r=await fetch(API+'/api/company-auth/activate-current-master',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({loginId:document.getElementById('loginId').value.trim(),temporaryPassword:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`API 오류 ${r.status}`);status.textContent=`연결 완료\n회사 ID: ${d.loginId}\n이제 시험버전 2에서 로그인할 수 있습니다.`}catch(err){status.textContent='연결 실패\n'+(err.message||err)}};
</script></body></html>
